// ---------- Landkarte ----------
// Alle Konzepte und Beziehungen des Wissensnetzes auf einer Fläche. Die Anordnung rechnet der Browser selbst aus (Kräftemodell, ohne Zufall),
// sie bedeutet nur „verbundene Konzepte liegen nah beieinander“. Es steht nichts darauf, was nicht im Netz steht.
function layoutKraefte(ids, kanten, breite, W, H) {
  const n = ids.length, idx = Object.fromEntries(ids.map((id, i) => [id, i]));
  const pos = ids.map((_, i) => [W / 2 + 0.38 * W * Math.cos((2 * Math.PI * i) / n), H / 2 + 0.38 * H * Math.sin((2 * Math.PI * i) / n)]);
  const paare = kanten.filter((e) => idx[e.von] != null && idx[e.nach] != null && e.von !== e.nach).map((e) => [idx[e.von], idx[e.nach]]);
  const k = Math.sqrt((W * H) / Math.max(n, 1)) * 0.85;
  for (let it = 0; it < 400; it++) {
    const t = 1 - it / 400, dp = pos.map(() => [0, 0]);
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const dx = pos[i][0] - pos[j][0], dy = pos[i][1] - pos[j][1], d = Math.max(Math.hypot(dx, dy), 0.5), f = (k * k) / d;
      dp[i][0] += (dx / d) * f; dp[i][1] += (dy / d) * f; dp[j][0] -= (dx / d) * f; dp[j][1] -= (dy / d) * f;
    }
    for (const [a, b] of paare) {
      const dx = pos[a][0] - pos[b][0], dy = pos[a][1] - pos[b][1], d = Math.max(Math.hypot(dx, dy), 0.5), f = (d * d) / k;
      dp[a][0] -= (dx / d) * f; dp[a][1] -= (dy / d) * f; dp[b][0] += (dx / d) * f; dp[b][1] += (dy / d) * f;
    }
    for (let i = 0; i < n; i++) {
      dp[i][0] += (W / 2 - pos[i][0]) * 0.3; dp[i][1] += (H / 2 - pos[i][1]) * 0.3; // schwache Mitte, hält Einzelne im Bild
      const l = Math.hypot(dp[i][0], dp[i][1]) || 1, s = Math.min(l, 60 * t + 2);
      pos[i][0] = Math.min(W - breite[i] / 2 - 8, Math.max(breite[i] / 2 + 8, pos[i][0] + (dp[i][0] / l) * s));
      pos[i][1] = Math.min(H - 24, Math.max(24, pos[i][1] + (dp[i][1] / l) * s));
    }
  }
  // Beschriftungen dürfen sich nicht überdecken: Kästen auseinanderschieben.
  for (let r = 0; r < 60; r++) {
    let bewegt = false;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const ox = (breite[i] + breite[j]) / 2 + 10 - Math.abs(pos[i][0] - pos[j][0]), oy = 34 - Math.abs(pos[i][1] - pos[j][1]);
      if (ox > 0 && oy > 0) {
        bewegt = true;
        if (oy < ox) { const s = (pos[i][1] <= pos[j][1] ? -1 : 1) * oy / 2; pos[i][1] += s; pos[j][1] -= s; }
        else { const s = (pos[i][0] <= pos[j][0] ? -1 : 1) * ox / 2; pos[i][0] += s; pos[j][0] -= s; }
      }
    }
    for (let i = 0; i < n; i++) { pos[i][0] = Math.min(W - breite[i] / 2 - 4, Math.max(breite[i] / 2 + 4, pos[i][0])); pos[i][1] = Math.min(H - 18, Math.max(18, pos[i][1])); }
    if (!bewegt) break;
  }
  // Was sich danach noch überdeckt, kommt auf den nächsten freien Platz (Suche in Ringen um die alte Stelle).
  const platziert = new Array(n).fill(false);
  const frei = (i, x, y) => {
    if (x < breite[i] / 2 + 4 || x > W - breite[i] / 2 - 4 || y < 18 || y > H - 18) return false;
    for (let j = 0; j < n; j++) if (platziert[j] && Math.abs(x - pos[j][0]) < (breite[i] + breite[j]) / 2 + 6 && Math.abs(y - pos[j][1]) < 32) return false;
    return true;
  };
  for (let i = 0; i < n; i++) {
    if (!frei(i, pos[i][0], pos[i][1])) {
      suche: for (let ring = 1; ring < 120; ring++) for (let a = 0; a < 8 * ring; a++) {
        const w = (2 * Math.PI * a) / (8 * ring), x = pos[i][0] + Math.cos(w) * ring * 16, y = pos[i][1] + Math.sin(w) * ring * 16;
        if (frei(i, x, y)) { pos[i] = [x, y]; break suche; }
      }
    }
    platziert[i] = true;
  }
  return Object.fromEntries(ids.map((id, i) => [id, pos[i]]));
}

// Zoom und Vollbild der Landkarte: Der Ausschnitt ist das viewBox-Rechteck, Zoom und Verschieben ändern nur dieses.
function landkarteZoom(box, W, H) {
  const svg = box.querySelector("svg"), hinweis = box.querySelector("#lk-hinweis");
  let v = { x: 0, y: 0, w: W, h: H };
  const MIN = 0.06, MAX = 1; // kleinster Ausschnitt 6 % der Karte, größter die ganze Karte
  const voll = () => document.fullscreenElement === box || box.classList.contains("vollbild");
  let geplant = false;
  const setze = () => { svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`); if (!geplant) { geplant = true; requestAnimationFrame(() => { geplant = false; anwenden(); }); } };
  const begrenze = () => {
    v.w = Math.min(W, Math.max(W * MIN, v.w)); v.h = v.w * (H / W);
    v.x = Math.min(W - v.w, Math.max(0, v.x)); v.y = Math.min(H - v.h, Math.max(0, v.y));
  };
  // Bildschirmpunkt → Kartenpunkt; bei „meet“-Skalierung kann Rand frei bleiben, deshalb über die tatsächliche Skala
  const geom = () => {
    const r = svg.getBoundingClientRect(), sk = Math.min(r.width / v.w, r.height / v.h);
    if (!(sk > 0)) return null; // nicht sichtbar (z. B. Tab im Hintergrund): nichts rechnen
    return { r, sk, ox: r.left + (r.width - v.w * sk) / 2, oy: r.top + (r.height - v.h * sk) / 2 };
  };
  const zoomUm = (faktor, cx, cy) => { // cx, cy in Bildschirmkoordinaten (oder null = Mitte)
    const g = geom(); if (!g) return; if (cx == null) { cx = g.r.left + g.r.width / 2; cy = g.r.top + g.r.height / 2; }
    const kx = v.x + (cx - g.ox) / g.sk, ky = v.y + (cy - g.oy) / g.sk, w0 = v.w;
    v.w = w0 * faktor; begrenze();
    const f = v.w / w0; v.x = kx - (kx - v.x) * f; v.y = ky - (ky - v.y) * f; begrenze(); setze();
  };
  // Im Vollbild bleiben Kästen und Schrift auf dem Bildschirm gleich groß (Lesbarkeit), nur die Abstände wachsen und schrumpfen mit dem Zoom.
  // Was sich beim Herauszoomen überdecken würde, wird nicht beschriftet: wichtige (viel verbundene) Konzepte zuerst, beim Hineinzoomen kommen die übrigen dazu.
  const pos = new Map(), knoten = [...svg.querySelectorAll("a[data-id]")].map((a) => {
    const g = a.querySelector("g"), t = g.querySelector("text"), r = g.querySelector("rect");
    const k = { id: a.dataset.id, g, px: +t.getAttribute("x"), py: +t.getAttribute("y"), bw: +r.getAttribute("width"), bh: +r.getAttribute("height"), blass: g.classList.contains("blass"), grad: 0 };
    pos.set(k.id, k); return k;
  });
  const linien = [...svg.querySelectorAll("line.kante[data-von]")].map((l) => ({ l, von: pos.get(l.dataset.von), nach: pos.get(l.dataset.nach), alt: ["x1", "y1", "x2", "y2"].map((a) => l.getAttribute(a)), op: l.style.opacity }));
  for (const e of linien) { if (e.von) e.von.grad++; if (e.nach) e.nach.grad++; }
  const reihe = [...knoten].sort((a, b) => a.blass - b.blass || b.grad - a.grad);
  const zaehl = box.querySelector("#lk-zaehl");
  const anwenden = () => {
    // Auch im normalen Fenster: Kästen in Bildschirmgröße, Überdecktes bleibt bis zum Hineinzoomen unbeschriftet.
    const g = geom(); if (!g) return;
    const ox = (g.r.width - v.w * g.sk) / 2, oy = (g.r.height - v.h * g.sk) / 2, m = 1 / g.sk, belegt = [];
    let sichtbar = 0;
    for (const k of reihe) {
      k.sx = (k.px - v.x) * g.sk + ox; k.sy = (k.py - v.y) * g.sk + oy;
      let zeigen = k.sx + k.bw / 2 > 0 && k.sx - k.bw / 2 < g.r.width && k.sy + k.bh / 2 > 0 && k.sy - k.bh / 2 < g.r.height;
      if (zeigen) zeigen = !belegt.some((b) => Math.abs(k.sx - b.sx) < (k.bw + b.bw) / 2 + 6 && Math.abs(k.sy - b.sy) < (k.bh + b.bh) / 2 + 4);
      k.da = zeigen; k.g.style.display = zeigen ? "" : "none";
      if (zeigen) { belegt.push(k); sichtbar++; k.g.setAttribute("transform", `translate(${k.px} ${k.py}) scale(${m}) translate(${-k.px} ${-k.py})`); }
    }
    for (const e of linien) {
      if (!e.von || !e.nach) continue;
      const a = e.von, b = e.nach, dx = b.px - a.px, dy = b.py - a.py;
      const rand = (n, vx, vy) => { // Austritt aus dem Kasten (Bildschirmgröße), nur wenn der Kasten gezeichnet wird
        if (!n.da) return [n.px, n.py];
        const t = Math.min((n.bw / 2 * m) / (Math.abs(vx) || 1e-6), (n.bh / 2 * m) / (Math.abs(vy) || 1e-6), 1); return [n.px + vx * t, n.py + vy * t];
      };
      const [x1, y1] = rand(a, dx, dy), [x2, y2] = rand(b, -dx, -dy);
      e.l.setAttribute("x1", x1); e.l.setAttribute("y1", y1); e.l.setAttribute("x2", x2); e.l.setAttribute("y2", y2);
      e.l.style.opacity = a.da && b.da ? "" : ".09"; // Linien zu unbeschrifteten Konzepten bleiben als Hintergrund
      e.l.style.display = a.da || b.da ? "" : "none";
    }
    zaehl.textContent = `${sichtbar} von ${knoten.length} Konzepten beschriftet, hineinzoomen zeigt mehr`;
  };
  const hinweisText = () => { hinweis.textContent = "Mausrad: Zoom · Ziehen: verschieben" + (voll() ? " · Esc beendet" : ""); };
  box.querySelector("#lk-plus").addEventListener("click", () => zoomUm(0.7));
  box.querySelector("#lk-minus").addEventListener("click", () => zoomUm(1 / 0.7));
  box.querySelector("#lk-reset").addEventListener("click", () => { v = { x: 0, y: 0, w: W, h: H }; setze(); });
  const knopf = box.querySelector("#lk-voll");
  const umschalten = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (box.classList.contains("vollbild")) { box.classList.remove("vollbild"); }
      else if (box.requestFullscreen) await box.requestFullscreen();
      else box.classList.add("vollbild");
    } catch { box.classList.toggle("vollbild"); } // Browser verweigert Vollbild: Ersatz über die ganze Fensterfläche
    stand();
  };
  const stand = () => { knopf.textContent = voll() ? "Vollbild beenden" : "Vollbild"; hinweisText(); requestAnimationFrame(anwenden); };
  knopf.addEventListener("click", umschalten);
  const ende = () => stand();
  document.addEventListener("fullscreenchange", ende); window.addEventListener("resize", ende);
  const taste = (ev) => {
    if (ev.key === "Escape" && box.classList.contains("vollbild")) { box.classList.remove("vollbild"); stand(); return; }
    const pfeil = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
    if (pfeil && voll() && !/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) { ev.preventDefault(); v.x += pfeil[0] * v.w * 0.12; v.y += pfeil[1] * v.h * 0.12; begrenze(); setze(); }
  };
  document.addEventListener("keydown", taste);
  const aufraeumen = new MutationObserver(() => { if (!box.isConnected) { document.removeEventListener("fullscreenchange", ende); window.removeEventListener("resize", ende); document.removeEventListener("keydown", taste); aufraeumen.disconnect(); } });
  aufraeumen.observe(document.body, { childList: true, subtree: true });
  svg.addEventListener("wheel", (ev) => {
    ev.preventDefault(); // auch im normalen Fenster: über der Karte zoomt das Mausrad statt die Seite zu scrollen
    const zeile = ev.deltaMode === 1 ? 16 : 1; // Zeilen- statt Pixel-Rad
    if (ev.shiftKey || ev.altKey || (!ev.ctrlKey && Math.abs(ev.deltaX) > Math.abs(ev.deltaY))) { // Verschieben ohne Klicken
      const g = geom(); if (!g) return;
      const dx = ev.shiftKey ? (ev.deltaX || ev.deltaY) : ev.altKey ? 0 : ev.deltaX, dy = ev.altKey ? ev.deltaY : 0;
      v.x += (dx * zeile) / g.sk; v.y += (dy * zeile) / g.sk; begrenze(); setze(); return;
    }
    zoomUm(Math.exp(ev.deltaY * zeile * (ev.ctrlKey ? 0.01 : 0.0015)), ev.clientX, ev.clientY); // Strg = Pinch auf dem Trackpad
  }, { passive: false });
  // Ziehen (Maus, Stift, Finger) und Zwei-Finger-Zoom
  const zeiger = new Map(); let bewegt = false, pinch0 = null;
  svg.addEventListener("pointerdown", (ev) => { zeiger.set(ev.pointerId, { x: ev.clientX, y: ev.clientY }); bewegt = false; pinch0 = null; });
  svg.addEventListener("pointermove", (ev) => {
    const p = zeiger.get(ev.pointerId); if (!p) return;
    const dx = ev.clientX - p.x, dy = ev.clientY - p.y;
    if (zeiger.size === 2) {
      const [a, b] = [...zeiger.values()], alt = Math.hypot(a.x - b.x, a.y - b.y);
      p.x = ev.clientX; p.y = ev.clientY;
      const [c, d] = [...zeiger.values()], neu = Math.hypot(c.x - d.x, c.y - d.y);
      if (alt > 0 && neu > 0) zoomUm(alt / neu, (c.x + d.x) / 2, (c.y + d.y) / 2);
      bewegt = true; return;
    }
    if (!bewegt && Math.hypot(dx, dy) < 4) return;
    if (!bewegt) { bewegt = true; svg.classList.add("zieht"); }
    const g = geom(); if (!g) return; v.x -= dx / g.sk; v.y -= dy / g.sk; begrenze(); setze();
    p.x = ev.clientX; p.y = ev.clientY;
  });
  const los = (ev) => { zeiger.delete(ev.pointerId); if (!zeiger.size) svg.classList.remove("zieht"); };
  svg.addEventListener("pointerup", los); svg.addEventListener("pointercancel", los);
  svg.addEventListener("click", (ev) => { if (bewegt) { ev.preventDefault(); ev.stopPropagation(); bewegt = false; } }, true); // nach dem Ziehen kein Konzept öffnen
  stand();
}

  };

  document.addEventListener("focusin", (ev) => { const a = ev.target.closest?.("[data-kid]"); if (a) { const r = a.getBoundingClientRect(); zeige(a, r.left + r.width / 2, r.bottom - 10); } });

let wissenCache = null;
async function ladeWissen() { return wissenCache ??= (await holen("/api/wissen")).eintraege; }
const LK_ART = { begriff: "Begriff", kernaussage: "Kernaussage", lernziel: "Lernziel", uebung: "Übung", hinweis: "Hinweis" };

// Aussagen aus den Gliederungen zu einem Konzept: auf den Belegseiten des Konzepts, Nennung des Begriffs zuerst
function unterlagenZu(k, wissen) {
  // Name auch ohne Klammerzusatz suchen: „Präventionsgesetz (Deutschland)“ findet „Präventionsgesetz“
  const woerter = [...new Set([k.name, ...(k.synonyme || [])].flatMap((w) => [w, w.replace(/\s*\([^)]*\)/g, "")]).map((w) => w.trim().toLocaleLowerCase("de")).filter((w) => w.length > 2))];
  const seiten = new Map((k.belege || []).map((b) => [b.einheit, new Set(b.seiten)]));
  const treffer = [];
  for (const e of wissen) {
    if (e.art === "konzept" || !LK_ART[e.art]) continue;
    const b = e.belege?.[0]; if (!b) continue;
    const text = ((e.titel || "") + " " + e.text).toLocaleLowerCase("de");
    const nennt = woerter.some((w) => text.includes(w));
    const aufSeite = seiten.get(b.einheit) && b.seiten.some((x) => seiten.get(b.einheit).has(x));
    if (!nennt && !aufSeite) continue;
    const begriff = e.art === "begriff" && woerter.includes((e.titel || "").toLocaleLowerCase("de"));
    treffer.push({ e, rang: (begriff ? 0 : nennt && aufSeite ? 1 : nennt ? 2 : 3) });
  }
  treffer.sort((a, b) => a.rang - b.rang);
  return treffer.filter((t) => t.rang < 3 || treffer.length < 4).slice(0, 6).map((t) => t.e);
}

function landkarteSteckbrief(box, n, stufen) {
  const svg = box.querySelector("svg");
  const tipp = document.createElement("div"); tipp.className = "lk-tipp"; tipp.hidden = true; tipp.setAttribute("role", "tooltip");
  const brief = document.createElement("section"); brief.className = "lk-steckbrief"; brief.setAttribute("aria-label", "Steckbrief"); brief.hidden = true; brief.setAttribute("aria-live", "polite");
  box.append(tipp, brief);
  const konzept = (a) => n.konzepte.find((x) => x.id === a?.dataset.id);
  const zeigeTipp = (k, x, y) => {
    tipp.innerHTML = `<strong>${esc(k.name)}</strong>${esc(k.beschreibung)}<div class="leise">Lernstufe: ${esc(STUFE[stufen[k.id]]?.[0] || stufen[k.id])}${k.herkunft === "vorschlag" ? " · Vorschlag (KI-Ergänzung)" : ""} · Klick für mehr</div>`;
    tipp.hidden = false;
    const r = tipp.getBoundingClientRect(), w = window.innerWidth, h = window.innerHeight;
    tipp.style.left = Math.max(8, Math.min(x + 14, w - r.width - 8)) + "px";
    tipp.style.top = (y + 18 + r.height > h - 8 ? Math.max(8, y - r.height - 12) : y + 18) + "px";
  };
  svg.addEventListener("pointermove", (ev) => {
    if (ev.buttons) { tipp.hidden = true; return; } // beim Ziehen kein Fenster
    const k = konzept(ev.target.closest?.("a[data-id]"));
    if (k) zeigeTipp(k, ev.clientX, ev.clientY); else tipp.hidden = true;
  });
  svg.addEventListener("pointerleave", () => { tipp.hidden = true; });
  svg.addEventListener("focusin", (ev) => { const a = ev.target.closest?.("a[data-id]"), k = konzept(a); if (k) { const r = a.getBoundingClientRect(); zeigeTipp(k, r.left + r.width / 2, r.bottom - 10); } });
  svg.addEventListener("focusout", () => { tipp.hidden = true; });
  const schliessen = () => { brief.hidden = true; svg.querySelector(".knoten.gewaehlt")?.classList.remove("gewaehlt"); };
  const oeffnen = async (k, a) => {
    tipp.hidden = true;
    svg.querySelector(".knoten.gewaehlt")?.classList.remove("gewaehlt"); a.querySelector(".knoten")?.classList.add("gewaehlt");
    const nachbarn = n.beziehungen.filter((b) => b.status !== "abgelehnt" && (b.von === k.id || b.nach === k.id));
    const kopf = `<button type="button" class="zu" aria-label="Steckbrief schließen" title="Schließen (Esc)">×</button>
      <h3>${esc(k.name)}</h3>
      <div class="leise">${(k.synonyme || []).length ? `auch: ${esc(k.synonyme.join(", "))} · ` : ""}Lernstufe ${stufeChip(stufen[k.id])}${k.herkunft === "vorschlag" ? ' <span class="chip vorschlag">Vorschlag (KI-Ergänzung)</span>' : ""}</div>
      <h4>Kurzdefinition</h4><p style="margin:4px 0">${esc(k.beschreibung)}</p>
      ${k.herkunft === "vorschlag" && k.begruendung ? `<p class="leise" style="margin:4px 0">Begründung: ${esc(k.begruendung)}${k.quelle ? ` · Quelle: ${esc(k.quelle)}` : ""}</p>` : ""}
      ${k.belege?.length ? `<div class="belegzeile">Belegt in: ${belegLinks(k.belege)}</div>` : ""}`;
    const fuss = `${nachbarn.length ? `<h4>Verbunden mit</h4><div>${nachbarn.slice(0, 10).map((b) => { const o = b.von === k.id ? b.nach : b.von; return `<a class="chip" href="#/netz/${encodeURIComponent(o)}" data-lk="${esc(o)}">${esc(n.konzeptNamen[o] || o)}</a>`; }).join(" ")}${nachbarn.length > 10 ? ` <span class="leise">+${nachbarn.length - 10}</span>` : ""}</div>` : ""}
      <h4>Weiter</h4><div><a href="#/netz/${encodeURIComponent(k.id)}">Konzept im Wissensnetz</a> · <a href="#/lernen/konzept/${encodeURIComponent(k.id)}">dazu lernen</a></div>`;
    brief.innerHTML = kopf + `<h4>In den Unterlagen</h4><p class="leise">wird geladen …</p>` + fuss;
    brief.hidden = false; brief.scrollTop = 0;
    let liste = [];
    try { liste = unterlagenZu(k, await ladeWissen()); } catch { /* ohne Gliederungen bleibt der Steckbrief kürzer */ }
    if (brief.hidden || !a.querySelector(".knoten.gewaehlt")) return; // inzwischen geschlossen oder anderes Konzept
    const unterlagen = liste.length ? `<ul>${liste.map((e) => `<li>${e.art === "begriff" ? `<strong>${esc(e.titel)}</strong>: ` : ""}${esc(e.text)}
        <div class="belegzeile">${esc(LK_ART[e.art])}${e.abschnitt ? " · " + esc(e.abschnitt) : ""} · ${belegLinks(e.belege)}${e.herkunft === "ki-ergaenzung" ? ` · <span class="chip vorschlag">KI-Ergänzung${e.quelle ? ", Quelle: " + esc(e.quelle) : ", " + esc(e.pruefstatus || "ungeprüft")}</span>` : ""}</div></li>`).join("")}</ul>`
      : `<p class="leise">Keine Aussage in den Gliederungen gefunden. Die Belegseiten oben führen zu den Folien.</p>`;
    brief.innerHTML = kopf + `<h4>In den Unterlagen</h4>${unterlagen}` + fuss;
  };
  svg.addEventListener("click", (ev) => {
    const a = ev.target.closest?.("a[data-id]"), k = konzept(a);
    if (!k || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button) return; // Strg-Klick öffnet weiterhin die Konzeptseite
    ev.preventDefault(); oeffnen(k, a);
  });
  brief.addEventListener("click", (ev) => {
    if (ev.target.closest(".zu")) { schliessen(); return; }
    const z = ev.target.closest("[data-lk]"); // Nachbarkonzept: in der Karte bleiben, wenn es dort zu sehen ist
    const a2 = z && svg.querySelector(`a[data-id="${CSS.escape(z.dataset.lk)}"]`), k2 = konzept(a2);
    if (k2) { ev.preventDefault(); oeffnen(k2, a2); }
  });
  const taste = (ev) => { if (ev.key === "Escape" && !brief.hidden) { ev.stopPropagation(); schliessen(); } };
  box.addEventListener("keydown", taste); document.addEventListener("keydown", taste, true);
  new MutationObserver((_, mo) => { if (!box.isConnected) { document.removeEventListener("keydown", taste, true); mo.disconnect(); } }).observe(document.body, { childList: true, subtree: true });
}

let karteOpt = { vorschlaege: true, einheit: "" };
async function zeigeLandkarte() {
  const [n, fragen, st] = await Promise.all([ladeNetz(), ladeFragen(), ladeLernstand()]);
  if (!n.vorhanden) { $("#haupt").innerHTML = `<h1>Landkarte</h1><p>Noch kein Wissensnetz vorhanden (<code>_lerntool/netz/wissensnetz.json</code>).</p>`; return; }
  $("#haupt").innerHTML = `<h1>Landkarte</h1><p class="laedt" role="status">Die Karte wird berechnet …</p>`;
  await new Promise((r) => setTimeout(r, 20)); // Hinweis zuerst zeichnen, dann rechnen (kein requestAnimationFrame: läuft in verdeckten Tabs nicht)
  const aktiv = fragen.filter(frageAktiv);
  const sichtbar = (x) => x.status !== "abgelehnt" && (karteOpt.vorschlaege || x.herkunft !== "vorschlag");
  const konzepte = n.konzepte.filter(sichtbar), erlaubt = new Set(konzepte.map((x) => x.id));
  const kanten = n.beziehungen.filter((b) => sichtbar(b) && erlaubt.has(b.von) && erlaubt.has(b.nach));
  const einheiten = [...new Set(n.konzepte.flatMap((x) => (x.belege || []).map((b) => b.einheit)))];
  const inEinheit = (x) => !karteOpt.einheit || (x.belege || []).some((b) => b.einheit === karteOpt.einheit);
  const kurz = (t) => (t.length > 24 ? t.slice(0, 23) + "…" : t);
  const breite = konzepte.map((x) => kurz(x.name).length * 7.2 + 18);
  // Höhe nach Platzbedarf der Kästen, damit sich Beschriftungen nicht überdecken müssen.
  const flaeche = breite.reduce((a, b) => a + b + 14, 0) * 40 * 1.8, W = Math.max(1180, Math.round(Math.sqrt(flaeche * 1.45))), H = Math.max(820, Math.round(flaeche / W)), pos = layoutKraefte(konzepte.map((x) => x.id), kanten, breite, W, H);
  const bw = Object.fromEntries(konzepte.map((x, i) => [x.id, breite[i]]));
  const rand = (id, o) => { // Punkt, an dem die Linie zum Ziel den Kasten von id verlässt
    const [x, y] = pos[id], [ox, oy] = pos[o], dx = ox - x, dy = oy - y, t = Math.min((bw[id] / 2) / (Math.abs(dx) || 1e-6), 15 / (Math.abs(dy) || 1e-6), 1);
    return [x + dx * t, y + dy * t];
  };
  const linien = kanten.map((b) => {
    const [x1, y1] = rand(b.von, b.nach), [x2, y2] = rand(b.nach, b.von), an = !inEinheit(n.konzepte.find((x) => x.id === b.von)) || !inEinheit(n.konzepte.find((x) => x.id === b.nach));
    return `<line class="kante ${b.status} ${b.herkunft} ${an ? "blass" : ""}" data-von="${esc(b.von)}" data-nach="${esc(b.nach)}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#lk-pf)"><title>${esc((n.konzeptNamen[b.von] || b.von) + " " + (BEZ[b.art] || b.art) + " " + (n.konzeptNamen[b.nach] || b.nach))} · ${b.herkunft === "vorschlag" ? "Vorschlag (KI-Ergänzung)" : "aus dem Dokument"}</title></line>`;
  }).join("");
  const stufen = Object.fromEntries(konzepte.map((x) => [x.id, stufe(x.id, aktiv, st)]));
  const knoten = konzepte.map((x) => {
    const [px, py] = pos[x.id];
    return `<a href="#/netz/${encodeURIComponent(x.id)}" data-id="${esc(x.id)}" aria-label="${esc(x.name)}: ${esc(x.beschreibung)}"><g class="knoten s-${stufen[x.id]} ${x.herkunft === "vorschlag" ? "vorschlag" : ""} ${inEinheit(x) ? "" : "blass"}"><rect rx="6"></rect><text x="${px}" y="${py}" text-anchor="middle" dominant-baseline="central">${esc(kurz(x.name))}</text></g></a>`;
  }).join("");
  const zahlen = STUFE_REIHE.map((s) => `${stufeChip(s)} ${konzepte.filter((x) => stufen[x.id] === s).length}`).join(" &nbsp; ");
  $("#haupt").innerHTML = `<h1>Landkarte</h1>
    <p class="leise">Alle Konzepte des <a href="#/netz">Wissensnetzes</a> auf einer Fläche, ${konzepte.length} Konzepte und ${kanten.length} Beziehungen. Mit der Maus über einem Begriff erscheint seine Kurzdefinition, ein Klick öffnet den Steckbrief mit dem, was in den Unterlagen dazu steht. Die Anordnung rechnet der Browser aus: verbundene Konzepte liegen nah beieinander, sonst bedeutet die Lage nichts. Die Farbe zeigt deine <a href="#/">Lernstufe</a>.</p>
    ${lernstandHinweis()}
    <div class="filter"><label><input type="checkbox" id="lk-vorschlag" ${karteOpt.vorschlaege ? "checked" : ""}> Vorschläge (KI-Ergänzung) zeigen</label>
      <select id="lk-einheit" aria-label="Einheit"><option value="">alle Einheiten</option>${einheiten.map((id) => `<option value="${esc(id)}" ${karteOpt.einheit === id ? "selected" : ""}>${esc(kurzName(id))}</option>`).join("")}</select>
      <span class="leise">${zahlen}</span></div>
    <div class="legende">
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" class="kante ki-entwurf"/></svg>aus dem Dokument</span>
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" class="kante ki-entwurf vorschlag"/></svg>Vorschlag (KI-Ergänzung)</span>
      <span>Kasten gestrichelt = Konzept ist ein Vorschlag</span></div>
    <div class="graph landkarte" id="lk-box"><div class="lk-werkzeug"><span class="lk-hinweis" id="lk-hinweis" title="Mausrad zoomt · Umschalt + Mausrad oder Ziehen verschiebt · Alt + Mausrad: hoch/runter · Pfeiltasten im Vollbild">Mausrad: Zoom · Ziehen: verschieben</span><span class="lk-hinweis" id="lk-zaehl"></span><button type="button" id="lk-plus" aria-label="Vergrößern" title="Vergrößern">+</button><button type="button" id="lk-minus" aria-label="Verkleinern" title="Verkleinern">−</button><button type="button" id="lk-reset" title="Ganze Karte zeigen">Alles</button><button type="button" id="lk-voll" title="Vollbild (Esc beendet)">Vollbild</button></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Landkarte aller Konzepte">
      <defs><marker id="lk-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="pf-ki-entwurf" d="M0,1 L10,5 L0,9 z"></path></marker></defs>
      ${linien}${knoten}</svg></div>`;
  rahmeKnoten();
  landkarteZoom($("#lk-box"), W, H);
  landkarteSteckbrief($("#lk-box"), n, stufen);
  $("#lk-vorschlag").addEventListener("change", (ev) => { karteOpt.vorschlaege = ev.target.checked; zeigeLandkarte(); });
  $("#lk-einheit").addEventListener("change", (ev) => { karteOpt.einheit = ev.target.value; zeigeLandkarte(); });
}

async function route() {
  const teile = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  document.querySelectorAll("header nav a").forEach((a) => {
    const an = (a.dataset.nav === "start" && (!teile[0] || teile[0] === "fortschritt")) || a.dataset.nav === teile[0];
    a.classList.toggle("aktiv", an);
    if (an) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  kursliste(false);
  const haupt = $("#haupt");
  haupt.setAttribute("aria-busy", "true");
  haupt.innerHTML = `<p class="laedt" role="status">Wird geladen …</p>`;
  document.title = "PH-Lerntool";
  lernTasten = null;
  try {
    if (teile[0] === "einheit") { navigation(teile[1]); await zeigeEinheit(teile[1], teile[2]); }
    else { navigation(null);
      if (teile[0] === "links") await zeigeLinks();
      else if (teile[0] === "bibliothek") await zeigeBibliothek();
      else if (teile[0] === "recht") await zeigeRecht(teile[1]);
      else if (teile[0] === "formeln") await zeigeFormeln(teile[1]);
      else if (teile[0] === "wissen") await zeigeWissen();
      else if (teile[0] === "netz") await zeigeNetz(teile[1]);
      else if (teile[0] === "landkarte") await zeigeLandkarte();
      else if (teile[0] === "freigabe") await zeigeFreigabe();
      else if (teile[0] === "lernen") await zeigeLernen(teile[1], teile[2]);
      else if (teile[0] === "fortschritt") await zeigeFortschritt();
      else if (teile[0] === "suche") await zeigeSuche(teile.slice(1).join("/"));
      else if (!teile[0] || teile[0] === "fortschritt") await zeigeStart();
      else $("#haupt").innerHTML = `<h1>Seite nicht gefunden</h1><p>Die Adresse „#/${esc(teile.join("/"))}“ gibt es im Lerntool nicht.</p><p><a class="knopf primaer" href="#/">Zum Dashboard</a></p>`;
      if (!((teile[0] === "recht" || teile[0] === "formeln") && teile[1])) window.scrollTo(0, 0); }
  } catch (err) {
    $("#haupt").innerHTML = err.status === 404
      ? `<h1>Nicht gefunden</h1><p>Das Gesuchte gibt es nicht (mehr). Vielleicht wurde die Datei umbenannt oder neu importiert.</p><p><a class="knopf primaer" href="#/">Zum Dashboard</a></p><p class="leise">${esc(err.message)}</p>`
      : err.status
        ? `<h1>Fehler</h1><p>Der Server meldet einen Fehler (${esc(String(err.status))}).</p><p class="leise">${esc(err.message)}</p>`
        : `<h1>Keine Verbindung</h1><p>Das Lerntool antwortet nicht. Läuft „phl app“ noch? Sonst neu starten und diese Seite neu laden.</p><p class="leise">${esc(err.message)}</p>`;
  } finally { $("#haupt").removeAttribute("aria-busy"); }
}
