<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PH-Lerntool</title>
<style>
  :root {
    --bg: #f7f6f2; --flaeche: #ffffff; --text: #1f2328; --leise: #5f6670; --linie: #e3e1da;
    --akzent: #1f6f5c; --akzent-hell: #e3f1ec; --warn: #8a5a00; --warn-hell: #fbf1dc;
    --feldrand: #80868e; --rot: #a8322d; --rot-hell: #fbe7e5; --blau: #2b5c9e; --blau-hell: #e6eef9; --grau-hell: #efeee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --flaeche: #1e2125; --text: #e6e6e3; --leise: #9aa0a6; --linie: #33373d;
      --akzent: #5cc2a3; --akzent-hell: #1d3530; --warn: #e2b04a; --warn-hell: #3a2f17;
      --feldrand: #737980; --rot: #ef8a84; --rot-hell: #3d2220; --blau: #8db4ea; --blau-hell: #1f2b3d; --grau-hell: #2a2d32;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--akzent); }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 16px; align-items: center; padding: 10px 20px;
           background: var(--flaeche); border-bottom: 1px solid var(--linie); }
  header .marke { font-weight: 650; white-space: nowrap; text-decoration: none; color: var(--text); }
  header nav { display: flex; gap: 6px 14px; flex-wrap: wrap; }
  header nav a { text-decoration: none; color: var(--leise); }
  header nav a.aktiv { color: var(--akzent); font-weight: 600; }
  header form { margin-left: auto; flex: 0 1 360px; }
  header input { width: 100%; padding: 7px 10px; border: 1px solid var(--linie); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  .rahmen { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--linie); padding: 14px 10px 40px; overflow: auto; max-height: calc(100vh - 53px); position: sticky; top: 53px; }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--leise); margin: 14px 8px 6px; }
  aside details { margin: 2px 0; }
  aside summary { cursor: pointer; padding: 4px 8px; border-radius: 5px; font-weight: 550; list-style-position: outside; }
  aside summary small { color: var(--leise); font-weight: 400; }
  aside ul { list-style: none; margin: 2px 0 6px; padding: 0 0 0 14px; }
  aside li a { display: block; padding: 3px 8px; border-radius: 5px; text-decoration: none; color: var(--text); font-size: 14px; }
  aside li a:hover { background: var(--grau-hell); }
  aside li a.aktiv { background: var(--akzent-hell); color: var(--akzent); }
  main { padding: 22px 28px 80px; min-width: 0; }
  h1 { font-size: 22px; margin: 0 0 6px; line-height: 1.3; }
  h2 { font-size: 17px; margin: 0; }
  .leise { color: var(--leise); }
  .meta { color: var(--leise); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 18px; }
  .chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--grau-hell); color: var(--leise); white-space: nowrap; }
  .chip.gruen { background: var(--akzent-hell); color: var(--akzent); }
  .norm { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
  .norm h3 { margin: 0 0 4px; font-size: 17px; }
  .norm .gl { font-size: 13px; }
  .norm p { margin: 6px 0; }
  .norm p.listelem { margin-left: 22px; }
  .norm.ziel { outline: 2px solid var(--akzent); }
  .norm { scroll-margin-top: 90px; }
  .rechtsquellen { border-left: 3px solid var(--akzent); padding: 6px 14px; margin: 12px 0; }
  .rechtsquellen ul { margin: 4px 0; padding-left: 18px; }
  .chip.gelb { background: var(--warn-hell); color: var(--warn); }
  .chip.rot { background: var(--rot-hell); color: var(--rot); }
  .chip.blau { background: var(--blau-hell); color: var(--blau); }
  .karten { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin: 16px 0 24px; }
  .karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; padding: 12px 14px; }
  .karte .zahl { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .seite { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; margin: 0 0 16px; scroll-margin-top: 70px; }
  .seite > .kopf { display: flex; gap: 10px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--linie); flex-wrap: wrap; }
  .seite > .kopf .herkunft { margin-left: auto; font-size: 12px; color: var(--leise); }
  .seite > .inhalt { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 16px; padding: 14px 16px; }
  .seite.ohne-bild > .inhalt { grid-template-columns: minmax(0, 1fr); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .seite img { width: 100%; border: 1px solid var(--linie); border-radius: 4px; cursor: zoom-in; background: #fff; }
  .hinweis { background: var(--warn-hell); color: var(--warn); padding: 6px 10px; border-radius: 6px; font-size: 14px; margin-bottom: 8px; }
  .notizen { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--linie); color: var(--leise); white-space: pre-wrap; }
  .linkliste { margin: 12px 0 0; padding: 0; list-style: none; font-size: 14px; }
  .linkliste li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; flex-wrap: wrap; }
  .linkliste a { overflow-wrap: anywhere; }
  table { border-collapse: collapse; width: 100%; background: var(--flaeche); font-size: 14px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--linie); vertical-align: top; }
  th { font-weight: 600; color: var(--leise); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td a { overflow-wrap: anywhere; }
  .filter { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
  select { padding: 5px 8px; border: 1px solid var(--linie); border-radius: 6px; background: var(--flaeche); color: var(--text); font: inherit; }
  .treffer { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
  .treffer a { font-weight: 600; text-decoration: none; }
  mark { background: var(--warn-hell); color: inherit; padding: 0 1px; }
  .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 20; cursor: zoom-out; }
  .zoom img { max-width: 96vw; max-height: 96vh; background: #fff; }
  .springen { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .springen input { width: 70px; padding: 4px 8px; border: 1px solid var(--linie); border-radius: 6px; background: var(--flaeche); color: var(--text); font: inherit; }
  .gliederung { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; padding: 14px 18px; margin: 0 0 22px; }
  .gliederung > .kopf { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
  .gliederung details { border-top: 1px solid var(--linie); padding: 8px 0; }
  .gliederung summary { cursor: pointer; font-weight: 600; }
  .gliederung summary .leise { font-weight: 400; font-size: 13px; }
  .gliederung h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--leise); margin: 10px 0 4px; }
  .gliederung ul { margin: 0; padding-left: 20px; }
  .gliederung li { margin: 4px 0; }
  .gliederung .belege { font-size: 13px; white-space: nowrap; }
  .gliederung .belege a { text-decoration: none; }
  .gliederung li.ki { border-left: 3px solid var(--warn); padding-left: 8px; }
  .rollen { overflow-x: auto; }
  .bib td:first-child { min-width: 280px; }
  .bib .angabe { font-size: 13px; color: var(--leise); margin-top: 4px; }
  .bib ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }
  .knopf { display: inline-block; padding: 5px 12px; border: 1px solid var(--linie); border-radius: 6px; background: var(--flaeche); color: var(--text);
           font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
  .knopf:hover { border-color: var(--akzent); }
  .knopf.primaer { background: var(--akzent); color: var(--flaeche); border-color: var(--akzent); }
  .knopf.an-gruen { background: var(--akzent-hell); color: var(--akzent); border-color: var(--akzent); font-weight: 600; }
  .knopf.an-rot { background: var(--rot-hell); color: var(--rot); border-color: var(--rot); font-weight: 600; }
  .chip.lang { white-space: normal; }
  .chip.vorschlag { background: transparent; border: 1px dashed var(--warn); color: var(--warn); }
  a.chip { text-decoration: none; }
  .eintrag { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
  .eintrag.ki { border-left: 3px solid var(--warn); }
  .eintrag .kopfzeile { display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; margin-bottom: 4px; }
  .eintrag .belege, .belegzeile { font-size: 13px; color: var(--leise); }
  .begruendung { font-size: 14px; background: var(--warn-hell); padding: 6px 10px; border-radius: 6px; margin: 6px 0; }
  .filter input[type=search] { padding: 6px 10px; border: 1px solid var(--linie); border-radius: 6px; background: var(--flaeche); color: var(--text); font: inherit; flex: 1 1 240px; }
  .filter label { font-size: 14px; color: var(--leise); }
  .konzeptliste { columns: 2 340px; column-gap: 24px; padding: 0; list-style: none; margin: 8px 0 24px; }
  .konzeptliste li { break-inside: avoid; padding: 3px 0; }
  .konzeptliste .kdef { font-size: 13px; color: var(--leise, #667); line-height: 1.35; }
  .notiz { width: 100%; padding: 5px 8px; border: 1px solid var(--linie); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; font-size: 14px; margin-top: 8px; }
  .aktionen { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .legende { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 13px; color: var(--leise); align-items: center; margin: 6px 0; }
  .legende svg { vertical-align: middle; margin-right: 4px; }
  .graph { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; margin: 10px 0 18px; }
  .graph svg { display: block; width: 100%; height: auto; }
  .kante { fill: none; stroke-width: 1.6; }
  .kante.geprueft { stroke: var(--akzent); } .kante.ki-entwurf { stroke: var(--leise); } .kante.abgelehnt { stroke: var(--rot); opacity: .6; }
  .kante.vorschlag { stroke-dasharray: 6 4; }
  .pf-geprueft { fill: var(--akzent); } .pf-ki-entwurf { fill: var(--leise); } .pf-abgelehnt { fill: var(--rot); }
  .klabel { font-size: 11px; fill: var(--leise); paint-order: stroke; stroke: var(--flaeche); stroke-width: 4px; stroke-linejoin: round; }
  .knoten rect { fill: var(--flaeche); stroke: var(--linie); stroke-width: 1.2; }
  .knoten.mitte rect { fill: var(--akzent-hell); stroke: var(--akzent); }
  .knoten.vorschlag rect { stroke: var(--warn); stroke-dasharray: 4 3; }
  .knoten text { font-size: 13px; fill: var(--text); }
  .knoten.mitte text { font-weight: 650; }
  .knoten.s-gesehen rect { fill: var(--blau-hell); } .knoten.s-verstanden rect { fill: var(--warn-hell); } .knoten.s-sicher rect { fill: var(--akzent-hell); stroke: var(--akzent); }
  .knoten.blass, .kante.blass { opacity: .22; }
  .landkarte { overflow-x: auto; position: relative; } .landkarte svg { min-width: 900px; touch-action: none; cursor: grab; } .landkarte svg.zieht { cursor: grabbing; }
  .lk-werkzeug { position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; gap: 4px; align-items: center; }
  .lk-werkzeug button { font: inherit; font-size: 15px; min-width: 34px; height: 32px; padding: 0 10px; border: 1px solid var(--linie); border-radius: 6px; background: var(--flaeche); color: var(--text); cursor: pointer; }
  .lk-werkzeug button:hover { background: var(--akzent-hell); color: var(--akzent); }
  .lk-werkzeug .lk-hinweis { font-size: 12px; color: var(--leise); margin-right: 6px; }
  .landkarte:fullscreen, .landkarte.vollbild { background: var(--flaeche); overflow: hidden; margin: 0; border: 0; border-radius: 0; }
  .landkarte.vollbild { position: fixed; inset: 0; z-index: 50; }
  .landkarte:fullscreen svg, .landkarte.vollbild svg { width: 100vw; height: 100vh; min-width: 0; }
  .lk-tipp { position: fixed; z-index: 60; max-width: 340px; padding: 8px 11px; border: 1px solid var(--linie); border-radius: 8px; background: var(--flaeche); color: var(--text); box-shadow: 0 4px 14px rgba(0,0,0,.15); font-size: 13.5px; line-height: 1.4; pointer-events: none; }
  .lk-tipp strong { display: block; font-size: 14.5px; margin-bottom: 3px; }
  .lk-tipp .leise { font-size: 12px; margin-top: 4px; }
  .lk-steckbrief { position: absolute; top: 48px; right: 8px; z-index: 3; width: min(380px, calc(100% - 16px)); max-height: calc(100% - 60px); overflow: auto; padding: 12px 14px; border: 1px solid var(--linie); border-radius: 8px; background: var(--flaeche); box-shadow: 0 6px 20px rgba(0,0,0,.18); font-size: 14px; }
  .lk-steckbrief h3 { margin: 0 28px 4px 0; font-size: 18px; }
  .lk-steckbrief h4 { margin: 12px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--leise); }
  .lk-steckbrief ul { margin: 4px 0; padding-left: 18px; } .lk-steckbrief li { margin: 4px 0; }
  .lk-steckbrief .zu { position: absolute; top: 8px; right: 8px; font: inherit; font-size: 18px; line-height: 1; width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--leise); cursor: pointer; }
  .lk-steckbrief .zu:hover { background: var(--grau-hell); color: var(--text); }
  .landkarte .knoten.gewaehlt rect { stroke: var(--akzent); stroke-width: 2.5; }
  .landkarte .kante { stroke-width: 1.2; opacity: .75; } .landkarte .kante.blass { opacity: .15; }
  a:hover > .knoten rect { stroke: var(--akzent); stroke-width: 2; }
  .lernkarte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 10px; padding: 18px 20px; max-width: 760px; }
  .lernkarte .frage { font-size: 18px; line-height: 1.45; margin: 10px 0 14px; font-weight: 600; }
  .lernkarte textarea { width: 100%; min-height: 70px; padding: 8px 10px; border: 1px solid var(--linie); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  .aufloesung { border-top: 1px solid var(--linie); margin-top: 14px; padding-top: 12px; }
  .optionen { display: grid; gap: 8px; }
  .optionen button { text-align: left; padding: 9px 12px; border: 1px solid var(--linie); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
  .optionen button:hover:not(:disabled) { border-color: var(--akzent); }
  .optionen button:disabled { cursor: default; }
  .optionen button.richtig { border-color: var(--akzent); background: var(--akzent-hell); }
  .optionen button.falsch { border-color: var(--rot); background: var(--rot-hell); }
  .optionen .erkl { display: block; font-size: 13px; color: var(--leise); margin-top: 3px; }
  .optionen .erkl[hidden] { display: none; }
  .bewertung { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  .bewertung.drei { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .bewertung button { padding: 8px 6px; }
  .bewertung small { display: block; color: var(--leise); font-size: 12px; font-weight: 400; }
  .fortschrittsbalken { height: 6px; background: var(--grau-hell); border-radius: 3px; overflow: hidden; margin: 6px 0 14px; max-width: 760px; }
  .fortschrittsbalken div { height: 100%; background: var(--akzent); }
  .spielblock { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 12px; padding: 16px; margin: 8px 0 20px; }
  .spielkopf { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .ring { position: relative; width: 96px; height: 96px; flex: none; }
  .ring svg { width: 100%; height: 100%; } .ring .bahn { fill: none; stroke: var(--grau-hell); stroke-width: 9; }
  .ring .fuell { fill: none; stroke: var(--akzent); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .6s; }
  .ring .mitte { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .ring .mitte strong { font-size: 24px; } .ring .mitte small { color: var(--leise); }
  .werte { flex: 1 1 260px; min-width: 0; } .werte .gross { font-size: 20px; font-weight: 650; }
  .woche { display: flex; gap: 8px; margin: 14px 0; }
  .woche .tag { flex: 1; text-align: center; } .woche .tag span { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; margin: 0 auto; border-radius: 50%; background: var(--grau-hell); color: var(--leise); font-weight: 650; }
  .woche .tag.teil span { background: var(--warn-hell); color: var(--warn); } .woche .tag.ok span { background: var(--akzent); color: var(--flaeche); }
  .woche .tag.heute span { outline: 2px solid var(--akzent); outline-offset: 2px; } .woche small { color: var(--leise); font-size: 12px; }
  .abzeichen summary { cursor: pointer; font-weight: 600; margin-bottom: 8px; }
  .siegelraster { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .siegel { border: 1px solid var(--linie); border-radius: 10px; padding: 8px; text-align: center; font-size: 14px; opacity: .55; }
  .siegel.da { opacity: 1; background: var(--warn-hell); border-color: var(--warn); } .siegel .sym { font-size: 26px; } .siegel small { display: block; color: var(--leise); font-size: 12px; }
  .sterne { color: var(--warn); letter-spacing: 2px; } .sterne .leer { color: var(--linie); }
  .kombo { color: var(--warn); font-weight: 650; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; z-index: 60; background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 15px; box-shadow: 0 6px 24px rgba(0,0,0,.25); transition: opacity .2s, transform .25s; max-width: 92vw; text-align: center; }
  .toast.zeigt { opacity: 1; transform: translate(-50%, 0); } .toast.gut { background: var(--akzent); color: var(--flaeche); } .toast.gross { font-weight: 650; font-size: 16px; }
  .konfetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
  .konfetti span { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall 1.9s ease-in forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(540deg); opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .toast, .ring .fuell { transition: none; } }
  .spielzeile { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; color: var(--leise); margin: 0 0 4px; }
  .spielzeile strong { color: var(--text); font-variant-numeric: tabular-nums; }
  .filter select { max-width: 100%; }
  .tabellenrahmen { overflow-x: auto; margin: 8px 0 22px; }
  .lernkarte .kopfzeile { display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
  .optionsliste { margin: 4px 0; padding-left: 20px; font-size: 14px; }
  .zahlrechts { text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) { .bewertung { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lernkarte { padding: 14px; }
    td { overflow-wrap: anywhere; } td .chip { white-space: normal; } }
  @media (max-width: 900px) {
    .rahmen { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--linie); }
    .seite > .inhalt { grid-template-columns: 1fr; }
    header { flex-wrap: wrap; padding: 10px 16px; }
    header form { flex: 1 1 100%; }
    main { padding: 18px 16px 60px; }
  }
  /* Formelsammlung */
  .formel { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 8px; padding: 14px 18px; margin: 14px 0; scroll-margin-top: 90px; }
  .formel.ziel { outline: 2px solid var(--akzent); }
  .formel h3 { margin: 0 0 6px; font-size: 18px; }
  .formelbox { font: 17px/1.5 "Cambria Math", "STIX Two Math", Cambria, Georgia, serif; background: var(--akzent-hell); color: var(--text);
               border-left: 4px solid var(--akzent); padding: 8px 14px; border-radius: 6px; margin: 8px 0; overflow-x: auto; }
  .formelbox.ki { background: var(--warn-hell); border-left-color: var(--warn); }
  .formel dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 6px 0 10px; font-size: 14px; }
  .formel dt { font-family: "Cambria Math", Cambria, Georgia, serif; font-weight: 600; }
  .formel dd { margin: 0; }
  .formel .abschnitt-titel { font-weight: 650; margin: 10px 0 2px; font-size: 14px; text-transform: uppercase; letter-spacing: .03em; color: var(--leise); }
  .ki-kasten { background: var(--warn-hell); border-left: 3px solid var(--warn); padding: 6px 10px; border-radius: 6px; margin: 6px 0; font-size: 14px; }

<script>
"use strict";
const ROLLEN = { lerninhalt: "Lerninhalt", literaturliste: "Literaturliste", quelle: "Quelle", datensatz: "Datensatz", pruefung: "Prüfungsfragen",
  dublette: "Dublette", ausgeschlossen: "ausgeschlossen", eigene_arbeit: "eigene Arbeit" };
const STATUS = {
  erreichbar: ["erreichbar", "gruen"], "gesperrt-oder-login": ["gesperrt/Login", "gelb"],
  "nicht-gefunden": ["nicht gefunden", "rot"], "nicht-erreichbar": ["nicht erreichbar", "rot"],
  "zu-viele-anfragen": ["zu viele Anfragen", "gelb"], fehler: ["Fehler", "rot"], ungeprueft: ["ungeprüft", ""] };
const TYPEN = { "rechtstext-ris": "Rechtstext (RIS)", "rechtstext-drittseite": "Rechtstext (Drittseite)", "rechtstext-eu": "Rechtstext (EU)",
  fachliteratur: "Fachliteratur", international: "international", "amtlich-at": "amtlich (AT)", hochschule: "Hochschule", medien: "Medien", sonstige: "sonstige" };
const ART = { anklickbar: "Link", text: "URL im Text", "doi-im-text": "DOI im Text", "pmid-im-text": "PMID im Text" };

const HERKUNFT = { dokument: ["wörtlich aus dem Dokument", ""], "dokument-verdichtet": ["verdichtet aus dem Dokument", "blau"], "ki-ergaenzung": ["KI-Ergänzung", "gelb"] };
const STRUKTUR_STATUS = { "ki-entwurf": "", geprueft: "geprüft", veraltet: "veraltet – Original hat sich geändert" };
const BIB_TYP = { artikel: "Artikel", buch: "Buch", buchkapitel: "Buchkapitel", bericht: "Bericht", reihe: "Reihe", checkliste: "Checkliste", webseite: "Webseite", sonstiges: "sonstiges" };
const META_QUELLE = { literaturangabe: "nur Literaturliste", crossref: "Crossref", pubmed: "PubMed" };

let bestand = null;
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const zahl = (n) => Number(n).toLocaleString("de-AT");
// Statische Fassung (phl export): window.STATISCH wird nur im Export gesetzt. Dann liegen die Antworten der Schnittstelle als Dateien unter /data/,
// die Suche läuft im Browser, und Originaldateien gibt es nicht.
const STATISCH = !!window.STATISCH;
const BASIS = window.STATISCH_BASIS || ""; // Unterpfad, z. B. "/ph-lernen" bei GitHub Pages (ohne Schrägstrich am Ende)
let suchIndex = null;
async function sucheStatisch(q) {
  suchIndex ??= await (await fetch(BASIS + "/data/suchindex.json")).json();
  const begriffe = q.normalize("NFC").toLowerCase().split(/\s+/).filter((b) => b.length >= 2);
  if (!begriffe.length) return { anfrage: q, treffer: [] };
  // wie auf dem Server: jedes Wort an einem Wortanfang („Inzidenz“ findet „Inzidenzrate“, nicht „Koinzidenz“)
  const muster = begriffe.map((b) => new RegExp("(?<![\\p{L}\\p{N}_])" + b.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "u"));
  const treffer = [];
  for (const s of suchIndex) {
    const text = s.t, klein = text.toLowerCase();
    const funde = muster.map((m) => m.exec(klein));
    if (!funde.every(Boolean)) continue;
    const start = Math.max(0, funde[0].index - 90);
    treffer.push({ einheit: s.e, kurs: s.k, datei: s.d, seite: s.s, ausschnitt: (start ? "… " : "") + text.slice(start, funde[0].index + 160).replace(/\s+/g, " ").trim() + " …" });
    if (treffer.length >= 150) break;
  }
  return { anfrage: q, treffer };
}
function statischeUrl(url) {
  const u = new URL(url, location.origin);
  if (u.pathname.startsWith("/api/einheit/")) return BASIS + "/data/einheit/" + u.pathname.slice(13) + ".json";
  return BASIS + "/data/" + u.pathname.slice(5) + ".json";
}
const holen = async (url) => {
  if (STATISCH && url.startsWith("/api/suche")) return sucheStatisch(new URL(url, location.origin).searchParams.get("q") || "");
  const r = await fetch(STATISCH ? statischeUrl(url) : url);
  if (!r.ok) throw Object.assign(new Error(`${r.status} bei ${url}`), { status: r.status });
  return r.json();
};
const originalUrl = (pfad, seite) => "/original/" + pfad.split("/").map(encodeURIComponent).join("/") + (seite ? `#page=${seite}` : "");
const originalLink = (pfad, seite, text) => STATISCH ? "" : `<a href="${originalUrl(pfad, seite)}" target="_blank" rel="noopener">${text}</a>`;
const statusChip = (p) => { const [t, k] = STATUS[p?.status || "ungeprueft"] || [p?.status, ""]; return `<span class="chip ${k}">${esc(t)}</span>`; };
const wort = (typ) => typ === "pptx" ? "Folie" : typ === "xlsx" ? "Blatt" : "Seite";

function sichtbar(d) { return ["lerninhalt", "literaturliste", "quelle", "datensatz", "pruefung"].includes(d.rolle) && d.einheit; }

function navigation(aktivId) {
  const nachSem = new Map();
  for (const d of bestand.dateien.filter(sichtbar)) {
    if (!nachSem.has(d.semester_name)) nachSem.set(d.semester_name, new Map());
    const kurse = nachSem.get(d.semester_name);
    const name = d.kurs + (d.vortragende.length ? ` (${d.vortragende.join(", ")})` : "");
    if (!kurse.has(name)) kurse.set(name, []);
    kurse.get(name).push(d);
  }
  let html = "";
  for (const [sem, kurse] of nachSem) {
    html += `<p class="sem">${esc(sem)}</p>`;
    for (const [kurs, liste] of [...kurse].sort((a, b) => a[0].localeCompare(b[0], "de"))) {
      const offen = liste.some((d) => d.id === aktivId);
      html += `<details ${offen ? "open" : ""}><summary>${esc(kurs)} <small>${liste.length}</small></summary><ul>`;
      for (const d of liste.sort((a, b) => a.pfad_anzeige.localeCompare(b.pfad_anzeige, "de"))) {
        const name = lesbar(d.pfad_anzeige);
        const st = bestand.struktur?.[d.id];
        const zusatz = (d.rolle !== "lerninhalt" ? ` <span class="chip">${esc(ROLLEN[d.rolle])}</span>` : "")
          + (st ? ` <span class="chip ${st === "geprueft" ? "gruen" : st === "veraltet" ? "rot" : "blau"}" title="Gliederung">Gliederung</span>` : "");
        html += `<li><a href="#/einheit/${encodeURIComponent(d.id)}" class="${d.id === aktivId ? "aktiv" : ""}">${esc(name)}${zusatz}</a></li>`;
      }
      html += "</ul></details>";
    }
  }
  $("#navi").innerHTML = html || `<p class="leise" style="padding:8px">Noch keine Einheiten.</p>`;
}

async function zeigeStart() { return zeigeFortschritt(); }

function fmtDatum(iso) { if (!iso) return "–"; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString("de-AT", { dateStyle: "medium", timeStyle: "short" }); }

function gliederung(s, id, w) {
  const ziel = (n) => `<a href="#/einheit/${encodeURIComponent(id)}/${n}">${n}</a>`;
  const belege = (seiten) => `<span class="belege leise">(${w === "Folie" ? "Folie" : "S."} ${seiten.map(ziel).join(", ")})</span>`;
  const herkunft = (a) => {
    if (a.herkunft === "dokument-verdichtet") return "";  // Normalfall, wird nicht bei jedem Punkt markiert
    const [t, k] = HERKUNFT[a.herkunft] || [a.herkunft, ""];
    const zusatz = a.herkunft === "ki-ergaenzung" ? (a.quelle ? ` · Quelle: ${esc(a.quelle)}` : ` · ${esc(a.pruefstatus || "ungeprüft")}`) : "";
    return ` <span class="chip ${k}">${esc(t)}${zusatz}</span>`;
  };
  const ki = (a) => a.herkunft === "ki-ergaenzung" ? "ki" : "";
  const punkt = (a) => `<li class="${ki(a)}">${esc(a.text)} ${belege(a.seiten)}${herkunft(a)}</li>`;
  const begriff = (b) => `<li class="${ki(b)}"><strong>${esc(b.begriff)}</strong>: ${esc(b.erklaerung)} ${belege(b.seiten)}${herkunft(b)}</li>`;
  const st = s.veraltet ? "veraltet" : s.status;
  let html = `<section class="gliederung"><div class="kopf"><h2>Gliederung</h2>
    ${STRUKTUR_STATUS[st] ? `<span class="chip ${st === "geprueft" ? "gruen" : "rot"}">${esc(STRUKTUR_STATUS[st])}</span>` : ""}</div>`;
  if (s.lernziele?.length) html += `<h4>Lernziele</h4><ul>${s.lernziele.map(punkt).join("")}</ul>`;
  for (const ab of s.abschnitte) {
    html += `<details><summary>${esc(ab.titel)} <span class="leise">· ${w} ${ziel(ab.von)}${ab.bis !== ab.von ? "–" + ab.bis : ""}</span></summary>
      ${ab.kernaussagen?.length ? `<h4>Kernaussagen</h4><ul>${ab.kernaussagen.map(punkt).join("")}</ul>` : ""}
      ${ab.begriffe?.length ? `<h4>Begriffe</h4><ul>${ab.begriffe.map(begriff).join("")}</ul>` : ""}
      ${ab.uebungen?.length ? `<h4>Übung</h4><ul>${ab.uebungen.map(punkt).join("")}</ul>` : ""}
      ${ab.nur_bild?.length ? `<p class="leise" style="font-size:13px">Inhalt nur im Bild, hier nicht erfasst: ${w} ${ab.nur_bild.map(ziel).join(", ")}</p>` : ""}
    </details>`;
  }
  if (s.hinweise?.length) html += `<h4>Hinweise</h4><ul>${s.hinweise.map(punkt).join("")}</ul>`;
  return html + "</section>";
}

async function zeigeEinheit(id, seite) {
  const [e, recht] = await Promise.all([holen("/api/einheit/" + encodeURIComponent(id)), ladeRecht().catch(() => null)]);
  const d = e.eintrag, w = wort(d.typ);
  document.title = d.pfad_anzeige.split("/").pop() + " – PH-Lerntool";
  let html = `<h1>${esc(lesbar(d.pfad_anzeige))}</h1>
    <div class="meta">
      <span>${esc(d.kurs)}${d.vortragende.length ? " · " + esc(d.vortragende.join(", ")) : ""}</span>
      <span>${esc(d.semester_name)}</span><span class="chip">${esc(ROLLEN[d.rolle])}</span>
      <span>${d.seiten} ${w === "Folie" ? "Folien" : w === "Blatt" ? "Blätter" : "Seiten"}</span>
      <span>Sprache: ${esc({ de: "Deutsch", en: "Englisch" }[d.sprache] || d.sprache)}</span>
      ${d.textarme_seiten?.length ? `<span class="chip gelb" title="Seiten mit kaum Text, meist Abbildungen. Ihr Inhalt steht nur im Seitenbild.">${d.textarme_seiten.length} ${w === "Folie" ? "Folien" : "Seiten"} fast nur Bild</span>` : ""}
      ${originalLink(d.pfad, null, "Original öffnen")}
    </div>
    ${recht ? rechtsquellenKasten(recht, id) : ""}
    ${e.struktur ? gliederung(e.struktur, id, w) : ""}
    <div class="springen"><label for="sprung">Zu ${w}</label><input id="sprung" type="number" min="1" max="${d.seiten}"></div>`;
  for (const s of e.seiten) {
    html += `<section class="seite ${s.bild ? "" : "ohne-bild"}" id="s${s.nr}">
      <div class="kopf"><h2>${w} ${s.nr}</h2>
        <span class="herkunft">Herkunft: ${esc(d.pfad_anzeige)}, ${w} ${s.nr}${STATISCH ? "" : " · " + originalLink(d.pfad, s.nr, "im Original")}</span></div>
      <div class="inhalt"><div>
        ${s.textarm ? `<div class="hinweis">Kaum Text auf dieser ${w} (vermutlich Abbildung). Der Inhalt ist hier nicht als Text erfasst, siehe Seitenbild.</div>` : ""}
        ${s.text ? `<div class="text">${esc(s.text)}</div>` : ""}
        ${s.notizen ? `<div class="notizen"><strong>Notizen:</strong>\n${esc(s.notizen)}</div>` : ""}
        ${s.links.length ? `<ul class="linkliste">${s.links.map((l) => `<li>${statusChip(l.pruefung)}<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.url)}</a><span class="leise">${esc(ART[l.art] || l.art)}</span>${l.pruefung?.webarchiv ? `<a href="${esc(l.pruefung.webarchiv)}" target="_blank" rel="noopener noreferrer">Archiv</a>` : ""}</li>`).join("")}</ul>` : ""}
      </div>
      ${s.bild ? `<div><img loading="lazy" src="${esc(s.bild)}" alt="${w} ${s.nr}"></div>` : ""}
      </div></section>`;
  }
  $("#haupt").innerHTML = html;
  $("#sprung").addEventListener("change", (ev) => { const n = ev.target.value; location.hash = `#/einheit/${encodeURIComponent(id)}/${n}`; });
  if (seite) document.getElementById("s" + seite)?.scrollIntoView();
  else window.scrollTo(0, 0);
}

function lizenzKurz(url) {
  const m = /creativecommons\.org\/licenses\/([^/]+)\/([^/]+)/.exec(url || "");
  return m ? `CC ${m[1].toUpperCase()} ${m[2]}` : "Lizenz";
}

async function zeigeBibliothek() {
  const [b, n] = await Promise.all([holen("/api/bibliothek"), ladeNetz()]);
  const namen = Object.fromEntries(bestand.dateien.map((d) => [d.id, d.pfad_anzeige.split("/").pop()]));
  const konzepteZu = (id) => n.literatur.filter((l) => l.bibliothek === id && l.status !== "abgelehnt").map((l) =>
    `<a class="chip ${l.herkunft === "vorschlag" ? "vorschlag" : l.status === "geprueft" ? "gruen" : ""}" href="#/netz/${encodeURIComponent(l.konzept)}"
       title="${esc((LIT_ART[l.art] || l.art) + " · " + (l.herkunft === "vorschlag" ? "Vorschlag (KI-Ergänzung): " + l.begruendung : "aus dem Dokument"))}">${esc(n.konzeptNamen[l.konzept] || l.konzept)}</a>`).join(" ");
  const zeilen = b.eintraege.map((e) => {
    const m = e.metadaten || {};
    const autor = e.autor_innen?.length ? e.autor_innen.join(", ") : "";
    const zugang = [
      e.doi ? `<a href="https://doi.org/${esc(e.doi)}" target="_blank" rel="noopener noreferrer">DOI</a>` : e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Link</a>` : "",
      e.datei_lokal && !STATISCH ? originalLink(e.datei_lokal, null, "lokale Datei") : "",
      e.lizenz ? `<span class="chip gruen" title="${esc(e.lizenz)}">${esc(lizenzKurz(e.lizenz))}</span>` : "",
    ].filter(Boolean).join(" · ");
    return `<tr><td><strong>${esc(e.titel)}</strong><div>${esc(autor)}${e.jahr ? ` (${e.jahr})` : ""}${e.erschienen_in ? ` · ${esc(e.erschienen_in)}` : ""}</div>
        <div class="angabe">Angabe in der Liste: ${esc(e.angabe_original)}</div></td>
      <td>${esc(BIB_TYP[e.typ] || e.typ)}</td>
      <td>${konzepteZu(e.id) || "–"}</td>
      <td>${zugang || "–"}</td>
      <td><span class="chip ${m.quelle === "literaturangabe" ? "" : "blau"}">${esc(META_QUELLE[m.quelle] || m.quelle)}</span>${m.abgerufen_am ? ` <span class="leise">${esc(m.abgerufen_am)}</span>` : ""}
        ${m.abweichungen?.length ? `<ul>${m.abweichungen.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
        ${m.hinweis ? `<div class="angabe">${esc(m.hinweis)}</div>` : ""}</td>
      <td>${e.fundstellen.map((f) => `<a href="#/einheit/${encodeURIComponent(f.einheit)}/${f.seite}">${esc(namen[f.einheit] || f.datei)}, S. ${f.seite}, Nr. ${esc(f.nr)}</a><div class="leise" style="font-size:13px">${esc(f.abschnitt || "")}</div>`).join("")}</td></tr>`;
  }).join("");
  const abw = b.eintraege.filter((e) => e.metadaten?.abweichungen?.length).length;
  $("#haupt").innerHTML = `<h1>Bibliothek</h1>
    <p class="leise">Spalte „Konzepte“: verknüpfte Begriffe aus dem <a href="#/netz">Wissensnetz</a>.</p>
    <div class="aktionen" style="margin-bottom:14px"><a class="knopf" href="/ph-lernen-7k3q9x/data/zotero-export.json" download="ph-lerntool-bibliothek.json">Für Zotero exportieren (CSL-JSON)</a></div>
    ${b.eintraege.length ? `<div class="rollen"><table class="bib"><thead><tr><th>Werk</th><th>Typ</th><th>Konzepte</th><th>Zugang</th><th>Metadaten</th><th>Fundstelle</th></tr></thead><tbody>${zeilen}</tbody></table></div>` : "<p>Noch keine Einträge.</p>"}`;
}

let rechtCache = null;
async function ladeRecht() { return rechtCache ??= await holen("/api/recht"); }
const RIS_NENNUNG = "Quelle: RIS, Bundeskanzleramt (CC BY 4.0)";
function normTitel(v) {
  const n = v.norm;
  return v.abschnitt ? `${v.abschnitt.typ === "Paragraph" ? "§" : "Art."} ${v.abschnitt.nr} ${n?.gesetz.abkuerzung || v.gesetz}` : (n?.gesetz.abkuerzung || v.gesetz);
}
function fundstellenLinks(fund) {
  const namen = Object.fromEntries(bestand.dateien.map((d) => [d.id, d.pfad_anzeige.split("/").pop().replace(/\.[^.]+$/, "")]));
  return fund.map((f) => `${esc(namen[f.einheit] || f.einheit)}: ${f.seiten.map((s) => `<a href="#/einheit/${encodeURIComponent(f.einheit)}/${s}">${s}</a>`).join(", ")}`).join(" · ");
}

async function zeigeRecht(zielId) {
  const r = await ladeRecht();
  document.title = "Recht – PH-Lerntool";
  const gruppen = new Map();
  for (const v of r.verweise) {
    const k = v.im_ris ? (v.norm?.gesetz.kurztitel || v.gesetz) : "Nicht im RIS (kein österreichisches Bundesrecht)";
    if (!gruppen.has(k)) gruppen.set(k, []);
    gruppen.get(k).push(v);
  }
  const karte = (v) => {
    const n = v.norm;
    let h = `<div class="norm" id="r-${esc(v.id)}"><h3>${esc(normTitel(v))}${n?.ueberschrift ? ` <span class="leise" style="font-weight:normal">· ${esc(n.ueberschrift)}</span>` : ""}</h3>`;
    if (n?.gliederung?.length) h += `<div class="gl leise">${esc(n.gliederung.join(" · "))}</div>`;
    if (v.hinweis) h += `<p class="leise">${esc(v.hinweis)}</p>`;
    if (n?.absaetze) h += n.absaetze.map((a) => `<p class="${a.startsWith("  ") ? "listelem" : ""}">${esc(a.trim())}</p>`).join("");
    else if (v.im_ris && n) h += `<p class="leise">Ganzes Gesetz: hier nur Angaben und Link, kein Text.</p>`;
    else if (v.im_ris) h += `<p class="hinweis">Noch nicht aus dem RIS abgerufen (<code>phl ris abrufen</code>).</p>`;
    const angaben = [];
    if (n) {
      angaben.push(`Fassung vom ${esc(n.fassung_vom)}`);
      if (n.inkrafttreten) angaben.push(`in Kraft seit ${esc(n.inkrafttreten)}`);
      if (n.ausserkrafttreten) angaben.push(`außer Kraft ab ${esc(n.ausserkrafttreten)}`);
      if (n.kundmachungsorgan) angaben.push(esc(n.kundmachungsorgan.trim()));
      const link = n.eli || n.gesetz.geltende_fassung_url;
      if (link) angaben.push(`<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">im RIS öffnen</a>`);
      if (n.eli && n.gesetz.geltende_fassung_url) angaben.push(`<a href="${esc(n.gesetz.geltende_fassung_url)}" target="_blank" rel="noopener noreferrer">ganzes Gesetz</a>`);
    }
    if (angaben.length) h += `<div class="belege leise">${angaben.join(" · ")}</div>`;
    h += `<div class="belege leise">In den Unterlagen: ${fundstellenLinks(v.fundstellen)}</div>`;
    return h + "</div>";
  };
  let html = `<h1>Recht</h1>
    <p class="leise">Gesetzesstellen, die in den Unterlagen vorkommen. Die Texte stammen unverändert aus dem RIS${r.fassung_vom ? `, Fassung vom ${esc(r.fassung_vom)}, abgerufen ${esc(fmtDatum(r.abgerufen_am))}` : ""}. Verbindlich ist nur die Kundmachung im Bundesgesetzblatt.<br>${RIS_NENNUNG}</p>`;
  for (const [titel, liste] of gruppen) html += `<h2>${esc(titel)}</h2>${liste.map(karte).join("")}`;
  if (!r.verweise.length) html += `<p>Noch keine Verweise (<code>recht/verweise.json</code>).</p>`;
  $("#haupt").innerHTML = html;
  const ziel = zielId && document.getElementById("r-" + zielId);
  if (ziel) { ziel.classList.add("ziel"); ziel.scrollIntoView(); } else window.scrollTo(0, 0);
}

function rechtsquellenKasten(r, einheitId) {
  const treffer = r.verweise.filter((v) => v.fundstellen.some((f) => f.einheit === einheitId));
  if (!treffer.length) return "";
  const zeile = (v) => {
    const seiten = v.fundstellen.filter((f) => f.einheit === einheitId).flatMap((f) => f.seiten);
    const titel = v.norm?.ueberschrift ? ` · ${esc(v.norm.ueberschrift)}` : "";
    return `<li><a href="#/recht/${encodeURIComponent(v.id)}">${esc(normTitel(v))}</a>${titel} <span class="belege leise">(S. ${seiten.map((s) => `<a href="#/einheit/${encodeURIComponent(einheitId)}/${s}">${s}</a>`).join(", ")})</span>${v.im_ris ? "" : ' <span class="chip">nicht im RIS</span>'}</li>`;
  };
  return `<section class="rechtsquellen"><strong>Rechtsquellen</strong> <span class="leise">· Text aus dem RIS${r.fassung_vom ? `, Fassung vom ${esc(r.fassung_vom)}` : ""}</span><ul>${treffer.map(zeile).join("")}</ul></section>`;
}

// ---------- Formelsammlung (#/formeln) ----------
// Lernfunktion: ausgearbeitete Beispiele mit schrittweise aufdeckbarem Rechenweg, Begründung in docs/LERNDESIGN.md.
let formelCache = null;
let formelFilter = { bereich: "", q: "" };
const fz = (x, stellen = 3) => Number.isFinite(x) ? x.toLocaleString("de-AT", { maximumFractionDigits: stellen }) : "–";
const prozent = (x, stellen = 1) => Number.isFinite(x) ? fz(x * 100, stellen) + " %" : "–";

function aussageKasten(a, titel) {
  if (!a) return "";
  if (a.herkunft !== "ki-ergaenzung") return `<p>${titel ? `<strong>${esc(titel)}:</strong> ` : ""}${esc(a.text)}</p>`;
  const angabe = [a.quelle ? `Quelle: ${esc(a.quelle)}` : "", a.pruefstatus === "ungeprueft" ? "ungeprüft" : ""].filter(Boolean).join(" · ");
  return `<div class="ki-kasten"><span class="marke-ki">KI-Ergänzung${titel ? ` · ${esc(titel)}` : ""}:</span> ${esc(a.text)}${angabe ? ` <span class="leise">(${angabe})</span>` : ""}</div>`;
}

function rechenbeispiel(b, fid, i) {
  const ki = b.herkunft === "ki-ergaenzung";
  const id = `rb-${fid}-${i}`;
  const herkunft = ki ? `<span class="chip gelb">KI-Ergänzung${b.quelle ? ": " + esc(b.quelle) : ""}${b.pruefstatus === "ungeprueft" ? " · ungeprüft" : ""}</span>`
    : b.beleg ? `<span class="belege leise">Folie: ${fundstellenLinks([b.beleg])}</span>` : "";
  return `<div class="rechenbeispiel${ki ? " ki" : ""}" id="${id}">
    <div><strong>${esc(b.titel)}</strong> ${herkunft}</div>
    <div><span class="leise">Gegeben:</span> ${esc(b.gegeben)}</div>
    <p class="leise" style="font-size:13px;margin:4px 0">Erst selbst rechnen, dann Schritt für Schritt vergleichen.</p>
    <ol>${b.schritte.map((s) => `<li hidden>${esc(s)}</li>`).join("")}</ol>
    <div class="loesung" hidden><div class="ergebnis">Ergebnis: ${esc(b.ergebnis)}</div>${b.deutung ? `<div><span class="leise">Deutung:</span> ${esc(b.deutung)}</div>` : ""}</div>
    <div class="aktionen" style="margin-top:6px"><button class="knopf" data-schritt="${id}">Nächster Schritt</button> <button class="knopf" data-alles="${id}">Ganzen Rechenweg zeigen</button></div>
  </div>`;
}

const RECHNER = {
  anteil: { felder: [["z", "Fälle (Zähler)", 50], ["n", "Personen (Nenner)", 5000]],
    rechne: (v) => `Anteil = ${fz(v.z)} / ${fz(v.n)} = ${fz(v.z / v.n, 5)} = ${prozent(v.z / v.n, 2)}` },
  rate: { felder: [["f", "neue Fälle", 5], ["pz", "Personenzeit (Jahre)", 25], ["pro", "pro … Personenjahre", 100]],
    rechne: (v) => `Rate = ${fz(v.f)} / ${fz(v.pz)} = ${fz(v.f / v.pz, 5)} pro Personenjahr = ${fz(v.f / v.pz * v.pro, 2)} pro ${fz(v.pro)} Personenjahre` },
  raten: { felder: [["f1", "Fälle exponiert", 58], ["pz1", "Personenjahre exponiert", 12559], ["f0", "Fälle nicht exponiert", 925], ["pz0", "Personenjahre nicht exponiert", 298815]],
    rechne: (v) => { const r1 = v.f1 / v.pz1, r0 = v.f0 / v.pz0;
      return `Rate exponiert = ${fz(r1 * 1000, 2)} pro 1000 PJ · Rate nicht exponiert = ${fz(r0 * 1000, 2)} pro 1000 PJ · Rate Ratio = ${fz(r1 / r0, 2)}`; } },
  vierfelder: { felder: [["a", "a: exponiert, krank (Fälle)", 20], ["b", "b: exponiert, gesund (Kontrollen)", 980], ["c", "c: nicht exponiert, krank", 30], ["d", "d: nicht exponiert, gesund", 3970]],
    rechne: (v) => { const r1 = v.a / (v.a + v.b), r0 = v.c / (v.c + v.d);
      return `Risiko exponiert = a/(a+b) = ${prozent(r1, 2)} · Risiko nicht exponiert = c/(c+d) = ${prozent(r0, 2)} · RR = ${fz(r1 / r0, 2)} · OR = ad/bc = ${fz((v.a * v.d) / (v.b * v.c), 2)}<br><span class="leise">RR nur bei Kohortendaten sinnvoll, in der Fall-Kontroll-Studie nur das OR.</span>`; } },
  nnt: { felder: [["rk", "Ereignisrate Kontrolle (%)", 4], ["rt", "Ereignisrate Therapie (%)", 3]],
    rechne: (v) => { const arr = v.rk - v.rt;
      return `ARR = ${fz(arr, 2)} % · RRR = ${fz(arr / v.rk * 100, 1)} % · NNT = 100 / ${fz(arr, 2)} = ${fz(100 / arr, 1)}${arr > 0 ? ` (aufgerundet ${Math.ceil(100 / arr - 1e-9)})` : ""}`; } },
  paf: { felder: [["p", "Anteil Exponierte (0–1)", 0.3], ["rr", "relatives Risiko", 2]],
    rechne: (v) => { const x = v.p * (v.rr - 1); return `PAF = ${fz(x, 3)} / (1 + ${fz(x, 3)}) = ${prozent(x / (1 + x), 1)}`; } },
  alpha: { felder: [["a", "α je Test", 0.05], ["k", "Zahl der Tests", 3]],
    rechne: (v) => `1 − (1 − ${fz(v.a)})^${fz(v.k)} = ${prozent(1 - Math.pow(1 - v.a, v.k), 1)} · Bonferroni: je Test α = ${fz(v.a / v.k, 4)}` },
  icer: { felder: [["c1", "Kosten neu", 2872], ["e1", "Effekt neu (QALYs)", 6.74], ["c2", "Kosten Vergleich", 1331], ["e2", "Effekt Vergleich (QALYs)", 6.69]],
    rechne: (v) => { const dc = v.c1 - v.c2, de = v.e1 - v.e2;
      const q = dc >= 0 ? (de >= 0 ? "NE: teurer und wirksamer, der Schwellenwert entscheidet" : "NW: teurer und weniger wirksam, die bisherige Behandlung dominiert")
        : (de >= 0 ? "SE: billiger und wirksamer, die neue Behandlung dominiert" : "SW: billiger, aber weniger wirksam");
      return `ΔKosten = ${fz(dc, 2)} · ΔEffekt = ${fz(de, 3)} · ICER = ${de ? fz(dc / de, 0) : "–"} pro QALY<br><span class="leise">Quadrant ${q}.</span>`; } },
  deskriptiv: { text: ["x", "Werte (durch Leerzeichen oder Strichpunkt getrennt)", "22 40 53 57 93 98 103 108 116 121 234"],
    rechne: (_, roh) => {
      const x = roh.split(/[\s;]+/).map((s) => Number(s.replace(",", "."))).filter(Number.isFinite);
      if (!x.length) return "Bitte Zahlen eingeben.";
      const n = x.length, s = [...x].sort((p, q) => p - q), summe = x.reduce((p, q) => p + q, 0), m = summe / n;
      const med = n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
      const zaehl = new Map(); x.forEach((w) => zaehl.set(w, (zaehl.get(w) || 0) + 1));
      const max = Math.max(...zaehl.values()); const modus = max > 1 ? [...zaehl].filter(([, c]) => c === max).map(([w]) => fz(w)).join(", ") : "kein Wert kommt öfter vor";
      const ss = x.reduce((p, w) => p + (w - m) ** 2, 0);
      return `geordnet: ${s.map((w) => fz(w)).join(", ")}<br>n = ${n} · Summe = ${fz(summe)} · Mittelwert = ${fz(m, 2)} · Median = ${fz(med, 2)} · Modus: ${modus}<br>Minimum ${fz(s[0])} · Maximum ${fz(s[n - 1])} · Spannweite ${fz(s[n - 1] - s[0])}${n > 1 ? `<br>Quadratsumme SS = ${fz(ss, 2)} · Varianz s² = SS/(n − 1) = ${fz(ss / (n - 1), 2)} · Standardabweichung s = ${fz(Math.sqrt(ss / (n - 1)), 2)}` : ""}`;
    } },
};

// Startwerte je Formel aus deren Folienbeispiel (sonst die Standardwerte des Rechners)
const RECHNER_START = { praevalenz: { z: 86, n: 2181 }, "odds-ratio": { a: 597, b: 666, c: 8, d: 114 } };
function rechnerHtml(typ, fid) {
  const r = RECHNER[typ];
  if (!r) return "";
  const start = RECHNER_START[fid] || {};
  const felder = r.text ? `<label style="display:flex;flex-wrap:wrap">${esc(r.text[1])} <input class="breit" data-feld="${r.text[0]}" value="${esc(r.text[2])}"></label>`
    : r.felder.map(([k, t, w]) => `<label>${esc(t)} <input type="number" step="any" data-feld="${k}" value="${start[k] ?? w}"></label>`).join("");
  return `<div class="rechner" data-rechner="${typ}" id="rr-${fid}"><strong>Selbst rechnen</strong> <span class="leise">(rechnet nur mit der Formel oben; Startwerte aus dem Beispiel)</span><div>${felder}</div><output></output></div>`;
}

function rechne(el) {
  const r = RECHNER[el.dataset.rechner];
  const werte = {}; let roh = "";
  el.querySelectorAll("input").forEach((i) => { werte[i.dataset.feld] = Number(i.value); roh = i.value; });
  try { el.querySelector("output").innerHTML = r.rechne(werte, roh); } catch { el.querySelector("output").textContent = "–"; }
}

function formelKarte(f, bereichName, alle) {
  const ki = f.formel_herkunft === "ki-ergaenzung";
  const titelVon = Object.fromEntries(alle.map((x) => [x.id, x.titel]));
  const namen = netzCacheFormeln?.konzeptNamen || {};
  let h = `<div class="formel" id="f-${esc(f.id)}" data-bereich="${esc(f.bereich)}">
    <h3>${esc(f.titel)} <span class="chip">${esc(bereichName)}</span></h3>
    <div class="formelbox${ki ? " ki" : ""}">${esc(f.formel)}</div>
    ${ki ? `<div class="ki-kasten"><span class="marke-ki">KI-Ergänzung:</span> Die Folien zeigen das Prinzip, aber nicht diese Formel. Quelle siehe unten.</div>` : ""}`;
  if (f.variablen.length) h += `<dl>${f.variablen.map((v) => `<dt>${esc(v.zeichen)}</dt><dd>${esc(v.bedeutung)}</dd>`).join("")}</dl>`;
  h += `<div class="abschnitt-titel">Wofür</div>${aussageKasten(f.wozu)}`;
  if (f.erklaerung) h += `<div class="abschnitt-titel">Erklärung</div>${aussageKasten(f.erklaerung)}`;
  if (f.beispiele?.length) h += `<div class="abschnitt-titel">Rechenweg</div>${f.beispiele.map((b, i) => rechenbeispiel(b, f.id, i)).join("")}`;
  if (f.hinweise?.length) h += `<div class="abschnitt-titel">Achtung</div>${f.hinweise.map((a) => aussageKasten(a, "Hinweis")).join("")}`;
  if (f.ergaenzungen?.length) h += f.ergaenzungen.map((a) => aussageKasten(a)).join("");
  if (f.rechner) h += rechnerHtml(f.rechner, f.id);
  const zusatz = [];
  if (f.konzepte.length) zusatz.push(`Konzepte: ${f.konzepte.map((k) => `<a class="chip blau" href="#/netz/${encodeURIComponent(k)}">${esc(namen[k] || k)}</a>`).join(" ")}`);
  if (f.verwandt?.length) zusatz.push(`Siehe auch: ${f.verwandt.map((v) => `<a href="#/formeln/${encodeURIComponent(v)}">${esc(titelVon[v] || v)}</a>`).join(", ")}`);
  zusatz.push(`Folien: ${fundstellenLinks(f.belege)}`);
  return h + zusatz.map((z) => `<div class="belege leise" style="margin-top:4px">${z}</div>`).join("") + "</div>";
}

let netzCacheFormeln = null;
async function zeigeFormeln(zielId) {
  const daten = formelCache ??= await holen("/api/formeln");
  try { netzCacheFormeln ??= await ladeNetz(); } catch { netzCacheFormeln = null; }
  document.title = "Formeln – PH-Lerntool";
  const bereiche = Object.fromEntries(daten.bereiche.map((b) => [b.id, b.name]));
  const passt = (f) => {
    if (formelFilter.bereich && f.bereich !== formelFilter.bereich) return false;
    if (!formelFilter.q) return true;
    const q = formelFilter.q.toLocaleLowerCase("de");
    return [f.titel, f.formel, f.wozu.text, f.erklaerung?.text, ...f.variablen.map((v) => v.bedeutung)].join(" ").toLocaleLowerCase("de").includes(q);
  };
  if (zielId) formelFilter = { bereich: "", q: "" };
  const render = () => {
    const liste = daten.formeln.filter(passt);
    let html = "";
    for (const b of daten.bereiche) {
      const teil = liste.filter((f) => f.bereich === b.id);
      if (teil.length) html += `<h2>${esc(b.name)}</h2>${teil.map((f) => formelKarte(f, b.name, daten.formeln)).join("")}`;
    }
    $("#formel-liste").innerHTML = html || "<p>Keine Formel passt zum Filter.</p>";
    $("#formel-anzahl").textContent = `${liste.length} von ${daten.formeln.length} Formeln`;
    $("#formel-liste").querySelectorAll("[data-rechner]").forEach(rechne);
    document.querySelectorAll(".formel-filter [data-bereich]").forEach((k) => k.classList.toggle("an-gruen", k.dataset.bereich === formelFilter.bereich));
  };
  const inhalt = daten.bereiche.map((b) => `<li><strong>${esc(b.name)}</strong>: ${daten.formeln.filter((f) => f.bereich === b.id).map((f) => `<a href="#/formeln/${encodeURIComponent(f.id)}">${esc(f.titel)}</a>`).join(" · ")}</li>`).join("");
  $("#haupt").innerHTML = `<h1>Formeln &amp; Rechnungen</h1>
    <p class="leise">Alle Formeln und Rechenbeispiele aus den Unterlagen zu Epidemiologie, klinischen Studien, Statistik und Gesundheitsökonomie, dazu Umwelt und Finanzierung. Zu jeder Formel: wofür man sie braucht, die Erklärung, der Rechenweg Schritt für Schritt und die Folien. Was nicht auf den Folien steht, ist gelb als „KI-Ergänzung“ markiert.</p>
    <ul class="formel-inhalt">${inhalt}</ul>
    <div class="formel-filter"><button class="knopf" data-bereich="">Alle</button>${daten.bereiche.map((b) => `<button class="knopf" data-bereich="${esc(b.id)}">${esc(b.name)}</button>`).join("")}
      <input type="search" id="formel-suche" placeholder="In Formeln suchen …" value="${esc(formelFilter.q)}" aria-label="In Formeln suchen"> <span class="leise" id="formel-anzahl"></span></div>
    <div id="formel-liste"></div>`;
  render();
  document.querySelectorAll(".formel-filter [data-bereich]").forEach((k) => k.addEventListener("click", () => { formelFilter.bereich = k.dataset.bereich; render(); }));
  $("#formel-suche").addEventListener("input", (ev) => { formelFilter.q = ev.target.value.trim(); render(); });
  const liste = $("#formel-liste");
  liste.addEventListener("click", (ev) => {
    const schritt = ev.target.closest("[data-schritt]"), alles = ev.target.closest("[data-alles]");
    const box = (schritt || alles) && document.getElementById((schritt || alles).dataset.schritt || alles.dataset.alles);
    if (!box) return;
    const offen = [...box.querySelectorAll("ol li[hidden]")];
    (alles ? offen : offen.slice(0, 1)).forEach((li) => { li.hidden = false; });
    if (alles || offen.length <= 1) { box.querySelector(".loesung").hidden = false; box.querySelector(".aktionen").hidden = true; }
  });
  liste.addEventListener("input", (ev) => { const r = ev.target.closest("[data-rechner]"); if (r) rechne(r); });
  const ziel = zielId && document.getElementById("f-" + zielId);
  if (ziel) { ziel.classList.add("ziel"); ziel.scrollIntoView(); } else window.scrollTo(0, 0);
}

let linkFilter = { status: "", typ: "", kurs: "" };

  const render = () => {
    const liste = alle.filter((l) => (!linkFilter.status || (l.pruefung?.status || "ungeprueft") === linkFilter.status)

    $("#linktabelle").innerHTML = `<p class="leise">${liste.length} von ${alle.length} Links</p>
      <div class="rollen"><table><thead><tr><th>Link</th><th>Typ</th><th>Status</th><th>Fundstellen</th></tr></thead><tbody>
      ${liste.map((l) => `<tr><td><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.url)}</a>
          ${l.pruefung?.webarchiv ? `<br><a href="${esc(l.pruefung.webarchiv)}" target="_blank" rel="noopener noreferrer" class="leise">Web-Archiv</a>` : ""}</td>
        <td>${esc(TYPEN[l.typ] || l.typ)}</td>
        <td>${statusChip(l.pruefung)}${l.pruefung?.http ? ` <span class="leise">${l.pruefung.http}</span>` : ""}</td>
        <td>${l.fundstellen.map((f) => `<a href="#/einheit/${encodeURIComponent(f.einheit)}/${f.seite}">${esc(namen[f.einheit] || f.datei)}, S. ${f.seite}</a>`).join("<br>")}</td></tr>`).join("")}
      </tbody></table></div>`;

/** Dashboard-Block: Ring fürs Tagesziel, Serie, Level, Punkte, Woche, Abzeichen. */
function spielBlock(st) {
  const n = st.tage?.[heuteIso()] || 0, ziel = st.einstellungen.tagesziel, se = serie(st), lv = levelVon(punkteGesamt(st));
  const anteil = Math.min(1, n / ziel), U = 2 * Math.PI * 34;
  const woche = [6, 5, 4, 3, 2, 1, 0].map((v) => {
    const d = tagVor(v), a = st.tage?.[d] || 0, geschafft = a >= ziel;
    return `<div class="tag ${geschafft ? "ok" : a ? "teil" : ""} ${v === 0 ? "heute" : ""}" title="${d}: ${a} Antworten"><span>${geschafft ? "✓" : a || ""}</span><small>${new Date(d + "T12:00").toLocaleDateString("de-AT", { weekday: "short" })}</small></div>`;
  }).join("");
  const abz = SIEGEL.map(([id, name, text]) => {
    const am = st.abzeichen?.[id];
    return `<div class="siegel ${am ? "da" : ""}" title="${esc(text)}${am ? " · " + am : ""}"><div class="sym">${am ? "🏅" : "🔒"}</div><div>${esc(name)}</div><small>${esc(text)}</small></div>`;
  }).join("");
  return `<div class="spielblock">
    <div class="spielkopf">
      <div class="ring"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" class="bahn"/><circle cx="40" cy="40" r="34" class="fuell" stroke-dasharray="${U}" stroke-dashoffset="${U * (1 - anteil)}" transform="rotate(-90 40 40)"/></svg>
        <div class="mitte"><strong>${n}</strong><small>/ ${ziel}</small></div></div>
      <div class="werte">
        <div><span class="gross">🔥 ${se.aktuell}</span> <span class="leise">${se.aktuell === 1 ? "Tag" : "Tage"} Serie · Rekord ${se.beste}${se.ruhetag ? " · heute fehlt noch das Ziel" : ""}</span></div>
        <div><span class="gross">⭐ Level ${lv.level}</span> <span class="leise">noch ${zahl(lv.bis)} Punkte bis Level ${lv.level + 1}</span></div>
        <div class="fortschrittsbalken" style="margin:4px 0 8px"><div style="width:${Math.round(lv.anteil * 100)}%"></div></div>
        <div><span class="gross">${zahl(punkteGesamt(st))}</span> <span class="leise">Punkte · bester Kombo ×${st.rekorde?.kombo || 0}</span></div>
      </div></div>
    <div class="woche">${woche}</div>
    <details class="abzeichen"><summary>Abzeichen ${Object.keys(st.abzeichen || {}).length} / ${SIEGEL.length}</summary><div class="siegelraster">${abz}</div></details>
    <p class="leise" style="font-size:13px;margin:8px 0 0">Punkte: ${PUNKTE.antwort} je Antwort, +${PUNKTE.richtig} für eine richtige Auswahlfrage, +${PUNKTE.kombo} ab 3 Treffern in Folge, +${PUNKTE.ziel} fürs Tagesziel, +${PUNKTE.runde} je beendeter Runde (+${PUNKTE.perfekt} ohne „Nochmal“).</p></div>`;
}

// Stufen je Konzept: beruhen auf Abrufergebnissen, nicht auf Selbsteinschätzung (siehe docs/LERNDESIGN.md).
const STUFE = { unbekannt: ["unbekannt", ""], gesehen: ["gesehen", "blau"], verstanden: ["verstanden", "gelb"], sicher: ["sicher", "gruen"] };
const STUFE_REIHE = ["sicher", "verstanden", "gesehen", "unbekannt"];
const SICHER_TAGE = 21; // Stabilität in Tagen; Schwelle angelehnt an „mature“ in Anki, eigene Festlegung
function stufe(konzeptId, fragen, st) {
  const karten = fragen.filter((q) => q.konzepte.includes(konzeptId)).map((q) => st.karten[q.id]);
  const richtig = (k) => k && k.verlauf.at(-1)?.note >= 2;
  if (karten.length && karten.every(richtig)) return karten.every((k) => k.s >= SICHER_TAGE) ? "sicher" : "verstanden";
  if (st.gesehen[konzeptId] || karten.some(Boolean)) return "gesehen";
  return "unbekannt";
}
const stufeChip = (s) => `<span class="chip ${STUFE[s][1]}" title="Lernstufe">${esc(STUFE[s][0])}</span>`;

const NOTEN = { 1: "Nochmal", 2: "Schwer", 3: "Gut", 4: "Leicht" };
const dauer = (tage) => tage === 0 ? "in 10 Min." : tage === 1 ? "in 1 Tag" : tage < 31 ? `in ${tage} Tagen`
  : tage < 365 ? `in ${Math.round(tage / 30.4)} Mon.` : `in ${(tage / 365).toLocaleString("de-AT", { maximumFractionDigits: 1 })} J.`;
const mische = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function ladeHerunter(name, daten) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(daten, null, 2)], { type: "application/json" }));
  a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- Lernen ----------
let lernFilter = { einheit: "", konzept: "" }, sitzung = null, lernTasten = null;
async function zeigeLernen(art, wert) {
  if (art === "konzept") lernFilter = { einheit: "", konzept: wert || "" };
  else if (art === "einheit") lernFilter = { einheit: wert || "", konzept: "" };
  const [fragen, n, st] = await Promise.all([ladeFragen(), ladeNetz(), ladeLernstand()]);
  const alle = fragen.filter(frageAktiv);
  if (!alle.length) { $("#haupt").innerHTML = `<h1>Lernen</h1><p>Noch keine Lernfragen vorhanden (<code>_lerntool/fragen/</code>).</p>`; return; }
  const passt = (q) => (!lernFilter.einheit || q.einheit === lernFilter.einheit) && (!lernFilter.konzept || q.konzepte.includes(lernFilter.konzept));
  const auswahl = alle.filter(passt), jetzt = new Date();
  const faellig = mische(auswahl.filter((q) => st.karten[q.id] && new Date(st.karten[q.id].faellig) <= jetzt));
  const unbekannt = mische(auswahl.filter((q) => !st.karten[q.id]));
  const frei = Math.max(0, st.einstellungen.neuProTag - neuHeute(st));
  const neue = unbekannt.slice(0, frei);
  sitzung = { fragen: Object.fromEntries(alle.map((q) => [q.id, q])), auswahl: auswahl.map((q) => q.id), rest: unbekannt.slice(frei).map((q) => q.id),
    schlange: [...faellig, ...neue].map((q) => q.id), pos: 0, beantwortet: 0, nochmal: 0, grenzeErreicht: unbekannt.length > neue.length };

  const einheiten = [...new Set(alle.map((q) => q.einheit))];
  const nachKurs = {};
  for (const id of einheiten) { const d = bestand.dateien.find((x) => x.id === id); (nachKurs[d?.kurs || "ohne Kurs"] ||= []).push(id); }
  const konzepte = [...new Set(alle.flatMap((q) => q.konzepte))].sort((a, b) => (n.konzeptNamen[a] || a).localeCompare(n.konzeptNamen[b] || b, "de"));
  $("#haupt").innerHTML = `<h1>Lernen</h1>
    ${lernstandHinweis()}
    <div id="l-spiel">${spielZeile(st)}</div>
    <div class="filter">
      <select id="l-einheit" aria-label="Einheit"><option value="">alle Einheiten</option>${Object.entries(nachKurs).map(([kurs, ids]) => `<optgroup label="${esc(kurs)}">${ids.map((id) =>
        `<option value="${esc(id)}" ${lernFilter.einheit === id ? "selected" : ""}>${esc(kurzName(id))}</option>`).join("")}</optgroup>`).join("")}</select>
      <select id="l-konzept" aria-label="Konzept"><option value="">alle Konzepte</option>${konzepte.map((id) => `<option value="${esc(id)}" ${lernFilter.konzept === id ? "selected" : ""}>${esc(n.konzeptNamen[id] || id)}</option>`).join("")}</select>
      <span class="leise">${auswahl.length} Fragen · ${faellig.length} fällig · ${neue.length} neu${sitzung.grenzeErreicht ? ` (Grenze ${st.einstellungen.neuProTag} neue pro Tag)` : ""}</span>
    </div>
    <div id="lern-flaeche"></div>`;
  $("#l-einheit").addEventListener("change", (ev) => { lernFilter.einheit = ev.target.value; zeigeLernen(); });
  $("#l-konzept").addEventListener("change", (ev) => { lernFilter.konzept = ev.target.value; zeigeLernen(); });
  zeigeKarte();
}

function zeigeKarte() {
  const s = sitzung, flaeche = $("#lern-flaeche");
  lernTasten = null;
  if (s.pos >= s.schlange.length) return zeigeRundenende();
  const q = s.fragen[s.schlange[s.pos]], karte = lernstand.karten[q.id], v = FSRS.vorschau(karte, new Date());
  s.aktiv = q.id;
  const offen = s.schlange.length - s.pos;
  const knoepfe = (noten) => `<div class="bewertung ${noten.length === 3 ? "drei" : ""}">${noten.map((g) =>
    `<button class="knopf ${g === 3 ? "primaer" : ""}" data-note="${g}"><strong>${g}</strong> ${NOTEN[g]}<small>${dauer(v[g])}</small></button>`).join("")}</div>`;
  const beleg = `<div class="belegzeile" style="margin-top:8px">Beleg: ${belegLinks(q.belege, true)}</div>`;
  flaeche.innerHTML = `<div class="fortschrittsbalken"><div style="width:${Math.round((100 * s.beantwortet) / (s.beantwortet + offen))}%"></div></div>
    <div class="lernkarte">
      <div class="kopfzeile"><span class="chip">${karte ? "Wiederholung" : "neu"}</span>${q.herkunft === "pruefungsblatt" ? ' <span class="chip gruen" title="Frage und Möglichkeiten wortgleich vom Prüfungsblatt">Prüfungsfrage</span>' : ""}
        <span class="leise" style="font-size:13px">${esc(kurzName(q.einheit))} · noch ${offen} in dieser Runde</span></div>
      <div class="frage">${esc(q.frage)}</div>
      ${q.typ === "karte" ? `<textarea id="l-eigene" placeholder="Deine Antwort (optional)" aria-label="Deine Antwort (optional)"></textarea>
        <div class="aktionen"><button class="knopf primaer" id="l-zeigen">Antwort zeigen</button></div>`
      : `<div class="optionen">${mische(q.optionen.map((o, i) => ({ ...o, i }))).map((o, nr) =>
          `<button data-option="${o.i}"><strong>${"abcdefgh"[nr]})</strong> ${esc(o.text)}<span class="erkl" hidden>${esc(o.erklaerung || "")}</span></button>`).join("")}</div>`}
      <div id="l-aufloesung"></div>
      <div class="aktionen" style="margin-top:16px">
        <button class="knopf" id="l-melden">Frage fehlerhaft melden</button>
        <span id="l-meldefeld" style="display:none"><input class="notiz" id="l-meldenotiz" type="text" placeholder="Was stimmt nicht?" aria-label="Was stimmt nicht?" style="margin:0;flex:1 1 260px">
          <button class="knopf an-rot" id="l-meldenOk">Melden und überspringen</button></span>
      </div>
    </div>`;
  const aufl = $("#l-aufloesung");
  const bewerten = () => aufl.querySelectorAll("[data-note]").forEach((b) => b.addEventListener("click", () => bewerteKarte(q, Number(b.dataset.note))));
  if (q.typ === "karte") {
    const zeigen = () => {
      if (!$("#l-zeigen")) return;
      $("#l-zeigen").parentElement.remove(); $("#l-eigene").readOnly = true; $("#l-eigene").blur();
      aufl.innerHTML = `<div class="aufloesung"><div><strong>Antwort:</strong> ${esc(q.antwort)}</div>
        ${q.erklaerung ? `<div class="leise" style="margin-top:6px">${esc(q.erklaerung)}</div>` : ""}${beleg}
        ${knoepfe([1, 2, 3, 4])}</div>`;
      bewerten();
      lernTasten = (ev) => { if (NOTEN[ev.key]) bewerteKarte(q, Number(ev.key)); };
    };
    $("#l-zeigen").addEventListener("click", zeigen);
    lernTasten = (ev) => { if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); zeigen(); } };
  } else {
    const waehle = (b) => {
      if (b.disabled) return;
      const gewaehlt = q.optionen[Number(b.dataset.option)], richtig = gewaehlt.richtig;
      flaeche.querySelectorAll("[data-option]").forEach((x) => {
        x.disabled = true; x.querySelector(".erkl").hidden = false;
        if (q.optionen[Number(x.dataset.option)].richtig) x.classList.add("richtig");
      });
      if (!richtig) b.classList.add("falsch");
      aufl.innerHTML = `<div class="aufloesung"><div><strong>${richtig ? "Richtig." : "Nicht richtig."}</strong> ${q.erklaerung ? esc(q.erklaerung) : ""}</div>${beleg}
        ${richtig ? `${knoepfe([2, 3, 4])}`
          : `<div class="aktionen" style="margin-top:12px"><button class="knopf primaer" data-note="1">Weiter</button></div>`}</div>`;
      bewerten();
      lernTasten = (ev) => { if (richtig ? ["2", "3", "4"].includes(ev.key) : ev.key === "Enter" || ev.key === "1") { ev.preventDefault(); bewerteKarte(q, richtig ? Number(ev.key) : 1); } };
    };
    flaeche.querySelectorAll("[data-option]").forEach((b) => b.addEventListener("click", () => waehle(b)));
    lernTasten = (ev) => { const i = "abcdefgh".indexOf(ev.key.toLowerCase()); const b = flaeche.querySelectorAll("[data-option]")[i]; if (i >= 0 && b) waehle(b); };
  }
  $("#l-melden").addEventListener("click", () => { $("#l-melden").remove(); $("#l-meldefeld").style.display = "contents"; $("#l-meldenotiz").focus(); lernTasten = null; });
  $("#l-meldenOk").addEventListener("click", () => {
    const notiz = $("#l-meldenotiz").value.trim();
    freigaben()[q.id] = { entscheidung: "abgelehnt", am: heuteIso(), ...(notiz ? { notiz } : {}) };
    sichereFreigaben();
    s.schlange = s.schlange.filter((id, i) => i < s.pos || id !== q.id);
    s.gemeldet = (s.gemeldet || 0) + 1;
    zeigeKarte();
  });
}

async function bewerteKarte(q, note) {
  const s = sitzung;
  if (s.aktiv !== q.id) return; // doppelte Auslösung (Klick und Taste) nur einmal werten
  s.aktiv = null; lernTasten = null;
  lernstand.karten[q.id] = FSRS.bewerte(lernstand.karten[q.id], note, new Date());
  for (const k of q.konzepte) if (!lernstand.gesehen[k]) lernstand.gesehen[k] = heuteIso();
  const lohn = belohne(q, note, s, Object.values(s.fragen));
  await sichereLernstand();
  if (lernstand.einstellungen.spielelemente) { zeigeToast(lohn.zeilen, lohn.gross ? "gross" : note >= 2 ? "gut" : ""); if (lohn.gross) konfetti(); }
  s.beantwortet++;
  if (note === 1) { s.nochmal++; s.schlange.push(q.id); } // erneut am Ende der Runde (successive relearning)
  s.pos++;
  if ($("#l-spiel")) $("#l-spiel").innerHTML = spielZeile(lernstand);
  zeigeKarte();
  const f = $("#lern-flaeche"); if (f && f.getBoundingClientRect().top < 0) f.scrollIntoView();
}

function zeigeRundenende() {
  const s = sitzung, jetzt = new Date();
  const bonus = s.beantwortet ? rundenBonus(s, Object.values(s.fragen)) : null;
  if (bonus) {
    sichereLernstand();
    if (lernstand.einstellungen.spielelemente) { zeigeToast(bonus.zeilen, "gross"); konfetti(); }
    if ($("#l-spiel")) $("#l-spiel").innerHTML = spielZeile(lernstand);
  }
  const naechste = s.auswahl.map((id) => lernstand.karten[id]?.faellig).filter((f) => f && new Date(f) > jetzt).sort()[0];
  $("#lern-flaeche").innerHTML = `<div class="lernkarte">
    <h2>${s.beantwortet ? "Runde beendet" : "Gerade nichts fällig"}</h2>
    ${s.beantwortet ? `<p>${s.beantwortet} Antworten, davon ${s.nochmal}× „Nochmal“.${s.besteKombo >= 3 && lernstand.einstellungen.spielelemente ? ` Bester Kombo ×${s.besteKombo}.` : ""}${s.gemeldet ? ` ${s.gemeldet} Frage(n) als fehlerhaft gemeldet, zu finden unter <a href="#/freigabe">Freigabe</a>.` : ""}</p>` : `<p>In dieser Auswahl ist im Moment keine Frage fällig.</p>`}
    <p class="leise">Nächste Frage fällig: ${naechste ? esc(fmtDatum(naechste)) : "–"}${s.rest.length ? ` · ${s.rest.length} neue offen` : ""}</p>
    <div class="aktionen">${s.rest.length ? `<button class="knopf" id="l-mehr">${Math.min(10, s.rest.length)} weitere neue Fragen</button>` : ""}
      <a class="knopf" href="#/">Zum Dashboard</a></div></div>`;
  $("#l-mehr")?.addEventListener("click", () => { s.schlange.push(...s.rest.splice(0, 10)); zeigeKarte(); });
}

// ---------- Fortschritt ----------
async function zeigeFortschritt(meldung) {
  const [fragen, n, st] = await Promise.all([ladeFragen(), ladeNetz(), ladeLernstand()]);
  const alle = fragen.filter(frageAktiv), jetzt = new Date();
  const k = (q) => st.karten[q.id];
  const zaehle = (liste) => {
    const gelernt = liste.filter(k);
    const faellig = (a, b) => gelernt.filter((q) => { const f = new Date(k(q).faellig); return f >= a && f < b; }).length;
    const r = gelernt.map((q) => FSRS.aktuelleAbrufbarkeit(k(q), jetzt));
    return { fragen: liste.length, gelernt: gelernt.length, heute: faellig(new Date(0), tagesgrenze(1)), morgen: faellig(tagesgrenze(1), tagesgrenze(2)),
      abruf: r.length ? Math.round((100 * r.reduce((a, b) => a + b, 0)) / r.length) : null };
  };
  const ges = zaehle(alle);
  const neuFrei = Math.min(Math.max(0, st.einstellungen.neuProTag - neuHeute(st)), alle.filter((q) => !k(q)).length);
  if (pruefeAbzeichen(st, alle).length) await sichereLernstand();
  const wdh = Object.values(st.karten).reduce((a, x) => a + (x.wdh || 0), 0);
  const einheiten = [...new Set(alle.map((q) => q.einheit))];
  const konzepte = n.konzepte.filter((x) => x.status !== "abgelehnt").map((x) => ({ ...x, stufe: stufe(x.id, alle, st), anzahl: alle.filter((q) => q.konzepte.includes(x.id)).length }))
    .sort((a, b) => STUFE_REIHE.indexOf(a.stufe) - STUFE_REIHE.indexOf(b.stufe) || a.name.localeCompare(b.name, "de"));
  const proStufe = Object.fromEntries(STUFE_REIHE.map((s) => [s, konzepte.filter((x) => x.stufe === s).length]));
  $("#haupt").innerHTML = `<h1>Lernfortschritt</h1>
    ${lernstandHinweis()}${meldung ? `<div class="hinweis">${meldung}</div>` : ""}
    <div class="karten">
      <div class="karte"><div class="zahl">${ges.heute}</div><div class="leise">heute fällig</div></div>
      <div class="karte"><div class="zahl">${ges.morgen}</div><div class="leise">morgen fällig</div></div>
      <div class="karte"><div class="zahl">${ges.gelernt}<span class="leise" style="font-size:16px"> / ${ges.fragen}</span></div><div class="leise">Fragen gelernt</div></div>
      <div class="karte"><div class="zahl">${zahl(wdh)}</div><div class="leise">Antworten</div></div>
      <div class="karte"><div class="zahl">${ges.abruf ?? "–"}${ges.abruf != null ? "&nbsp;%" : ""}</div><div class="leise" title="Wie wahrscheinlich du die schon gelernten Fragen jetzt noch richtig weißt. Schätzung des Wiederholungsplans (FSRS), Mittel über alle gelernten Fragen.">Abrufwahrscheinlichkeit (geschätzt) <span aria-hidden="true">ⓘ</span></div></div>
    </div>
    <div class="aktionen" style="margin:-8px 0 18px"><a class="knopf primaer" href="#/lernen">${ges.heute ? `${ges.heute} fällige Fragen lernen` : neuFrei ? `${neuFrei} neue Fragen lernen` : "Lernen"}</a></div>
    ${st.einstellungen.spielelemente ? spielBlock(st) : ""}
    <h2>Nach Einheit</h2>
    <div class="tabellenrahmen"><table><thead><tr><th>Einheit</th><th>Sterne</th><th class="zahlrechts">Fragen</th><th class="zahlrechts">gelernt</th><th class="zahlrechts">heute fällig</th><th class="zahlrechts">Abruf (geschätzt)</th></tr></thead><tbody>
      ${einheiten.map((id) => { const z = zaehle(alle.filter((q) => q.einheit === id)); return `<tr><td><a href="#/lernen/einheit/${encodeURIComponent(id)}">${esc(kurzName(id))}</a></td>
        <td>${sternText(sterne(id, alle, st))}</td><td class="zahlrechts">${z.fragen}</td><td class="zahlrechts">${z.gelernt}</td><td class="zahlrechts">${z.heute}</td><td class="zahlrechts">${z.abruf != null ? z.abruf + " %" : "–"}</td></tr>`; }).join("")}
    </tbody></table></div>
    <h2>Konzepte</h2>
    <p class="leise" style="font-size:14px">${STUFE_REIHE.map((s) => `${stufeChip(s)} ${proStufe[s]}`).join(" &nbsp; ")}</p>
    <details class="leise" style="font-size:14px;margin-bottom:10px"><summary>Was bedeuten die Stufen?</summary><ul style="margin:6px 0"><li><strong>gesehen</strong>: Konzept geöffnet oder eine Frage dazu beantwortet.</li><li><strong>verstanden</strong>: alle Fragen zuletzt richtig.</li><li><strong>sicher</strong>: verstanden, und jede Frage hält mindestens ${SICHER_TAGE} Tage.</li></ul></details>
    <details><summary>Alle Konzepte anzeigen</summary><div class="tabellenrahmen"><table><thead><tr><th>Konzept</th><th>Stufe</th><th class="zahlrechts">Fragen</th><th></th></tr></thead><tbody>
      ${konzepte.map((x) => `<tr><td><a href="#/netz/${encodeURIComponent(x.id)}">${esc(x.name)}</a></td><td>${stufeChip(x.stufe)}</td><td class="zahlrechts">${x.anzahl}</td>
        <td>${x.anzahl ? `<a href="#/lernen/konzept/${encodeURIComponent(x.id)}">lernen</a>` : ""}</td></tr>`).join("")}
    </tbody></table></div></details>
    <h2>Lernstand</h2>
    <div class="filter"><label>Neue Fragen pro Tag <input id="f-neu" type="number" min="1" max="200" value="${st.einstellungen.neuProTag}" style="width:80px"></label>
      <label>Tagesziel (Antworten) <input id="f-ziel" type="number" min="1" max="200" value="${st.einstellungen.tagesziel}" style="width:80px"></label>

}
const konzeptLink = (n, id) => `<a href="#/netz/${encodeURIComponent(id)}" data-kid="${esc(id)}">${esc(n.konzeptNamen[id] || id)}</a>`;

function satz(n, x, bib) {
  if (x.typ === "konzepte") return `Konzept ${konzeptLink(n, x.id)}`;
  if (x.typ === "fragen") return `<strong>${esc(x.frage)}</strong> <span class="leise" style="font-size:13px">(${x.typ_frage === "auswahl" ? "Auswahlfrage" : "Karteikarte"} · ${x.konzepte.map((id) => konzeptLink(n, id)).join(", ")})</span>`;
  if (x.typ === "beziehungen") return `${konzeptLink(n, x.von)} <em>${esc(BEZ[x.art] || x.art)}</em> ${konzeptLink(n, x.nach)}`;
  const e = bib?.[x.bibliothek];
  return `„${esc(e ? e.titel : x.bibliothek)}“ <em>${esc(LIT_ART[x.art] || x.art)}</em> ${konzeptLink(n, x.konzept)}`;
}

function egoGraph(n, k, kanten) {
  // kanten: Beziehungen, an denen k beteiligt ist. Ein Knoten pro Nachbar, eine Linie pro Beziehung.
  const nachbarn = [...new Set(kanten.map((b) => (b.von === k.id ? b.nach : b.von)))];
  const m = nachbarn.length;
  if (!m) return `<p class="leise">Keine Beziehungen zu anderen Konzepten.</p>`;
  const W = m > 10 ? 960 : 820, H = m > 10 ? 660 : m > 5 ? 500 : 400, cx = W / 2, cy = H / 2, rx = W / 2 - 120, ry = H / 2 - 36;
  // Bei vielen Nachbarn abwechselnd innen und außen, damit sich die Beschriftungen nicht überlappen.
  const pos = Object.fromEntries(nachbarn.map((id, i) => {
    const w = -Math.PI / 2 + (Math.PI / m) + (2 * Math.PI * i) / m, f = m > 8 && i % 2 ? 0.68 : 1;
    return [id, [cx + f * rx * Math.cos(w), cy + f * ry * Math.sin(w)]]; }));
  pos[k.id] = [cx, cy];
  const vorschlagKonzept = Object.fromEntries(n.konzepte.map((x) => [x.id, x.herkunft === "vorschlag"]));
  let linien = "", labels = "";
  for (const id of nachbarn) {
    const liste = kanten.filter((b) => b.von === id || b.nach === id);
    liste.forEach((b, j) => {
      const [x1, y1] = pos[b.von], [x2, y2] = pos[b.nach];
      const len = Math.hypot(x2 - x1, y2 - y1) || 1, ox = (-(y2 - y1) / len) * (j - (liste.length - 1) / 2) * 14, oy = ((x2 - x1) / len) * (j - (liste.length - 1) / 2) * 14;
      const p = (t) => [x1 + (x2 - x1) * t + ox, y1 + (y2 - y1) * t + oy];
      // Pfeilspitze auf dem Weg zum Ziel; der Text sitzt näher am Nachbarn, damit er sich in der Mitte nicht stapelt.
      const aus = b.von === k.id, tPfeil = aus ? 0.4 : 0.6, tText = aus ? 0.66 : 0.34;
      const [ax, ay] = p(tPfeil), [lx, ly] = p(tText);
      linien += `<polyline class="kante ${b.status} ${b.herkunft}" points="${x1 + ox},${y1 + oy} ${ax},${ay} ${x2 + ox},${y2 + oy}" marker-mid="url(#pf-${b.status})"><title>${esc((n.konzeptNamen[b.von] || b.von) + " " + (BEZ[b.art] || b.art) + " " + (n.konzeptNamen[b.nach] || b.nach))} · ${b.herkunft === "vorschlag" ? "Vorschlag (KI-Ergänzung)" : "aus dem Dokument"}</title></polyline>`;
      labels += `<text class="klabel" x="${lx}" y="${ly}" text-anchor="middle" dy="-3">${esc(BEZ[b.art] || b.art)}</text>`;
    });
  }
  const kurz = (t) => (t.length > 26 ? t.slice(0, 25) + "…" : t);
  const knoten = (id, mitte) => {
    const [x, y] = pos[id];
    const g = `<g class="knoten ${mitte ? "mitte" : ""} ${vorschlagKonzept[id] ? "vorschlag" : ""}"><rect rx="6"></rect><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${esc(kurz(n.konzeptNamen[id] || id))}</text></g>`;
    return mitte ? g : `<a href="#/netz/${encodeURIComponent(id)}" data-kid="${esc(id)}" aria-label="${esc((n.konzeptNamen[id] || id) + ": " + (konzeptInfo[id]?.beschreibung || ""))}">${g}</a>`;
  };
  const pfeil = (s) => `<marker id="pf-${s}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path class="pf-${s}" d="M0,1 L10,5 L0,9 z"></path></marker>`;
  return `<div class="graph"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Beziehungen von ${esc(k.name)}">
    <defs>${["geprueft", "ki-entwurf", "abgelehnt"].map(pfeil).join("")}</defs>
    ${linien}${labels}${nachbarn.map((id) => knoten(id, false)).join("")}${knoten(k.id, true)}</svg></div>`;
}
function rahmeKnoten() {
  document.querySelectorAll(".graph .knoten").forEach((g) => {
    const t = g.querySelector("text").getBBox(), r = g.querySelector("rect");
    r.setAttribute("x", t.x - 8); r.setAttribute("y", t.y - 5); r.setAttribute("width", t.width + 16); r.setAttribute("height", t.height + 10);
  });
}
